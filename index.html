<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countersign</title>
<meta name="description" content="Countersign demo: a second signature before any code change that moves money goes live.">
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f8f9fb; --ink: #0f172a; --ink-2: #334155; --muted: #64748b;
  --line: #e2e8f0; --line-2: #cbd5e1;
  --brand: #4338ca; --brand-ink: #ffffff; --brand-soft: #eef0ff;
  --bad: #dc2626; --bad-soft: #fef2f2; --bad-line: #fecaca;
  --warn: #b45309; --warn-soft: #fffbeb; --warn-line: #fde68a;
  --good: #15803d; --good-soft: #f0fdf4; --good-line: #bbf7d0;
  --add: #e6ffec; --add-ink: #116329; --del: #ffebe9; --del-ink: #a40e26;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .08);
  --radius: 12px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f17; --surface: #121826; --surface-2: #0f1522; --ink: #e5e9f0; --ink-2: #c3cad6; --muted: #8a94a6;
    --line: #232b3b; --line-2: #2f394c;
    --brand: #8b93ff; --brand-ink: #0b0f17; --brand-soft: #1c2142;
    --bad: #f87171; --bad-soft: #2a1215; --bad-line: #5b1d22;
    --warn: #fbbf24; --warn-soft: #2a2010; --warn-line: #5a4316;
    --good: #4ade80; --good-soft: #0f2418; --good-line: #1d4d2f;
    --add: #0f2a18; --add-ink: #7ee2a1; --del: #2d1316; --del-ink: #ff9aa5;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f17; --surface: #121826; --surface-2: #0f1522; --ink: #e5e9f0; --ink-2: #c3cad6; --muted: #8a94a6;
  --line: #232b3b; --line-2: #2f394c;
  --brand: #8b93ff; --brand-ink: #0b0f17; --brand-soft: #1c2142;
  --bad: #f87171; --bad-soft: #2a1215; --bad-line: #5b1d22;
  --warn: #fbbf24; --warn-soft: #2a2010; --warn-line: #5a4316;
  --good: #4ade80; --good-soft: #0f2418; --good-line: #1d4d2f;
  --add: #0f2a18; --add-ink: #7ee2a1; --del: #2d1316; --del-ink: #ff9aa5;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--brand); text-decoration: none; }
button { font: inherit; }
code, .mono { font-family: var(--mono); font-size: .92em; }

/* App shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 17px; letter-spacing: -.01em; padding: 2px 8px; color: var(--ink); }
.logo svg { flex: none; }
.workspace { margin: 0 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 13px; }
.workspace b { display: block; font-size: 13.5px; }
.workspace span { color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); font-weight: 550; font-size: 14px; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--brand-soft); color: var(--brand); }
.nav a .count { margin-left: auto; font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 999px; background: var(--bad); color: #fff; }
.nav a .count[hidden] { display: none; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 8px; display: flex; flex-direction: column; gap: 8px; }
.theme-btn { align-self: flex-start; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
.main { padding: 26px 32px 60px; max-width: 1240px; width: 100%; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head h1 { font-size: 24px; letter-spacing: -.015em; margin: 0; line-height: 1.25; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.crumbs a { color: var(--muted); }
.sample { display: inline-block; font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; vertical-align: middle; }

/* Building blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-h h2, .card-h h3 { margin: 0; font-size: 15px; }
.card-b { padding: 16px 18px; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { padding: 16px 18px; }
.kpi .label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.kpi .value { font-size: 26px; font-weight: 750; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .hint { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.two { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); margin-top: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.idle { color: var(--muted); background: var(--surface-2); border-color: var(--line); }
.pill.run { color: var(--brand); background: var(--brand-soft); }
.pill.run::before { animation: pulse 1s infinite; }
.pill.bad { color: var(--bad); background: var(--bad-soft); border-color: var(--bad-line); }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
.pill.good { color: var(--good); background: var(--good-soft); border-color: var(--good-line); }
@keyframes pulse { 50% { opacity: .25; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9px; padding: 9px 14px; font-weight: 650; font-size: 14px; cursor: pointer; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); transition: transform .05s, background .15s, opacity .15s; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover:not(:disabled) { background: var(--brand); filter: brightness(1.08); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.good:hover:not(:disabled) { background: var(--good); filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn kbd { font-family: var(--mono); font-size: 11px; opacity: .7; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 18px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .05em; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.money-bad { color: var(--bad); font-weight: 750; }
.muted { color: var(--muted); }
.feed { list-style: none; margin: 0; padding: 4px 0; }
.feed li { display: flex; gap: 12px; padding: 10px 18px; font-size: 14px; border-bottom: 1px solid var(--line); }
.feed li:last-child { border-bottom: 0; }
.feed .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; background: var(--muted); }
.feed .dot.bad { background: var(--bad); } .feed .dot.good { background: var(--good); } .feed .dot.run { background: var(--brand); }
.feed time { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.empty { padding: 22px 18px; color: var(--muted); font-size: 14px; }

/* Change page */
.change-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13.5px; margin-top: 8px; }
.meta code { color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); padding: 0 6px; border-radius: 6px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stepper { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding: 6px; }
.step { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; min-width: 0; }
.step .ico { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; border: 2px solid var(--line-2); color: var(--muted); background: var(--surface); }
.step .txt { min-width: 0; }
.step .txt b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .txt span { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.running { background: var(--brand-soft); }
.step.running .ico { border-color: var(--brand); color: var(--brand); border-top-color: transparent; animation: spin .8s linear infinite; }
.step.pass .ico { border-color: var(--good); background: var(--good); color: #fff; }
.step.warn .ico { border-color: var(--warn); background: var(--warn); color: #fff; }
.step.fail .ico { border-color: var(--bad); background: var(--bad); color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }

.banner { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
.banner .big { font-size: 28px; line-height: 1; }
.banner h2 { margin: 0; font-size: 18px; }
.banner p { margin: 4px 0 0; color: var(--ink-2); }
.banner.bad { background: var(--bad-soft); border-color: var(--bad-line); }
.banner.bad h2 { color: var(--bad); }
.banner.good { background: var(--good-soft); border-color: var(--good-line); }
.banner.good h2 { color: var(--good); }
.banner.run { background: var(--brand-soft); border-color: transparent; }

.check { overflow: hidden; scroll-margin-top: 16px; }
#banner, #stepper { scroll-margin-top: 16px; }
.check.pending { opacity: .55; }
.check .card-h .q { font-size: 12px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .06em; }
.check .card-h h3 { font-size: 16px; }
.check .answer { font-size: 22px; font-weight: 750; letter-spacing: -.01em; }
.answer.bad { color: var(--bad); } .answer.warn { color: var(--warn); } .answer.good { color: var(--good); }
.explain { font-size: 14px; color: var(--ink-2); margin: 4px 0 0; }

/* caller map */
.callers { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: center; }
.map { width: 100%; height: auto; display: block; }
.map .edge { stroke: var(--line-2); stroke-width: 2; transition: stroke .3s; }
.map .edge.scan { stroke: var(--brand); }
.map .edge.ok { stroke: var(--good); opacity: .55; }
.map .edge.broke { stroke: var(--bad); stroke-width: 3; stroke-dasharray: 6 5; }
.map .node rect { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; transition: fill .3s, stroke .3s; }
.map .node text { fill: var(--ink-2); font-size: 14px; font-weight: 600; font-family: system-ui, sans-serif; }
.map .node.scan rect { stroke: var(--brand); fill: var(--brand-soft); }
.map .node.ok rect { stroke: var(--good); }
.map .node.broke rect { stroke: var(--bad); fill: var(--bad-soft); stroke-width: 2.5; }
.map .node.broke text { fill: var(--bad); }
.map .hub rect { fill: var(--brand); stroke: var(--brand); }
.map .hub text { fill: var(--brand-ink); font-family: var(--mono); font-weight: 700; font-size: 15px; }
.callist { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.callist li { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.callist li:last-child { border-bottom: 0; }
.callist .nm { font-weight: 650; }
.callist .why { color: var(--muted); font-size: 12.5px; margin-left: auto; text-align: right; }
.callist li.broke .nm { color: var(--bad); }
.tag { font-size: 11px; font-weight: 750; padding: 1px 7px; border-radius: 999px; }
.tag.bad { background: var(--bad); color: #fff; }
.tag.good { background: var(--good-soft); color: var(--good); border: 1px solid var(--good-line); }
.fmt { margin-top: 12px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }

/* replay */
.counters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.counter { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.counter .n { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.counter .l { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.counter.bad .n { color: var(--bad); } .counter.good .n { color: var(--good); }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; margin: 14px 0 6px; display: flex; }
.bar .ok { background: var(--good); opacity: .75; width: 0; }
.bar .ko { background: var(--bad); width: 0; }
.rule { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; font-size: 14px; }
.rule code { background: var(--surface-2); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; }
.example { margin-top: 14px; border-radius: 10px; border: 1px solid var(--bad-line); background: var(--bad-soft); padding: 14px 16px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.example .lbl { font-size: 12px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }
.example .amt { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.example .arrow { font-size: 22px; color: var(--muted); }
.example .amt.bad { color: var(--bad); }
.rows tr.new { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--bad-soft); } to { background: transparent; } }

/* sign-off */
.approver { display: flex; gap: 14px; align-items: center; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: linear-gradient(135deg, #6366f1, #0ea5e9); flex: none; }
.approver b { display: block; }
.approver span { color: var(--muted); font-size: 13.5px; }

/* side column */
.controls .card-b { display: flex; flex-direction: column; gap: 10px; }
.controls .btn { width: 100%; justify-content: space-between; }
.controls small { color: var(--muted); font-size: 12.5px; }
.merge { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.merge-note { font-size: 13px; color: var(--muted); margin-top: 8px; }
pre.json { margin: 0; padding: 14px 16px; font-family: var(--mono); font-size: 12px; line-height: 1.5; color: var(--ink-2); background: var(--surface-2); max-height: 340px; overflow: auto; border-radius: 0 0 var(--radius) var(--radius); white-space: pre-wrap; word-break: break-word; }

/* diff */
.tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 10px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; font-family: var(--mono); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--brand); }
.tabs .plus { color: var(--good); } .tabs .minus { color: var(--bad); }
.diff { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; overflow: auto; max-height: 230px; }
.diff div { white-space: pre; padding: 0 16px; min-width: max-content; }
.diff .a { background: var(--add); color: var(--add-ink); }
.diff .d { background: var(--del); color: var(--del-ink); }
.diff .h { color: var(--muted); background: var(--surface-2); padding-top: 4px; padding-bottom: 4px; }
.diff .c { color: var(--ink-2); }

/* how it works */
.how-hero { padding: 26px 28px; }
.how-hero h1 { font-size: 30px; letter-spacing: -.02em; margin: 0 0 6px; }
.how-hero p { font-size: 16px; color: var(--ink-2); margin: 0; max-width: 760px; }
.three { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; }
.how-card { padding: 18px; }
.how-card .num { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 800; }
.how-card h3 { margin: 12px 0 6px; font-size: 17px; }
.how-card p { margin: 0 0 10px; color: var(--ink-2); font-size: 14px; }
.how-card dl { margin: 0; font-size: 13.5px; }
.how-card dt { font-weight: 700; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-top: 10px; }
.how-card dd { margin: 2px 0 0; }
.flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; padding: 18px; }
.flow .box { flex: 1 1 150px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); font-size: 13.5px; }
.flow .box b { display: block; margin-bottom: 2px; }
.flow .box.us { border-color: var(--brand); background: var(--brand-soft); }
.flow .arr { flex: none; display: grid; place-items: center; width: 34px; color: var(--muted); font-size: 18px; }
.honest { margin-top: 16px; padding: 14px 18px; font-size: 14px; color: var(--ink-2); }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 10; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Small screens */
@media (max-width: 1080px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .workspace, .side-foot span { display: none; }
  .side-foot { margin: 0 0 0 auto; padding: 0; }
  .nav { flex-direction: row; overflow-x: auto; width: 100%; order: 3; }
  .nav a { white-space: nowrap; }
  .main { padding: 18px 16px 48px; }
  .two, .three, .callers { grid-template-columns: minmax(0, 1fr); }
  .stepper { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .counters { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .counter .n { font-size: 20px; }
  th, td { padding: 9px 12px; }
  .flow { flex-direction: column; }
  .flow .arr { width: auto; height: 26px; transform: rotate(90deg); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="logo" href="#/overview" aria-label="Countersign home">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <rect width="28" height="28" rx="8" fill="var(--brand)"/>
        <path d="M6.5 14.5l3.2 3.2L15 11.5" fill="none" stroke="var(--brand-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12.5 14.5l3.2 3.2 6-6.7" fill="none" stroke="var(--brand-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
      </svg>
      Countersign
    </a>
    <div class="workspace"><b>Sample Payments Co.</b><span>Demo workspace · made-up data</span></div>
    <nav class="nav" aria-label="Main">
      <a href="#/overview" data-nav="overview">Overview</a>
      <a href="#/change" data-nav="change">Changes <span class="count" id="navCount" hidden>1</span></a>
      <a href="#/audit" data-nav="audit">Audit log</a>
      <a href="#/how" data-nav="how">How it works</a>
    </nav>
    <div class="side-foot">
      <button class="theme-btn" id="themeBtn" type="button">Theme: auto</button>
      <span>Demo on one sample API. Not a product you can install yet.</span>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var D = window.COUNTERSIGN;
  var view = document.getElementById("view");
  if (!D) {
    view.innerHTML = '<div class="card card-b">Missing <code>data.js</code>. Run <code>scripts/demo_local.sh</code> to create it.</div>';
    return;
  }

  // ---------- helpers ----------
  var params = new URLSearchParams((location.hash.split("?")[1]) || "");
  var SPEED = Math.max(0.2, Math.min(3, parseFloat(params.get("speed")) || 1));
  function focusOn(id) {
    if (current() !== "change") return;
    var el = document.getElementById(id);
    if (el && !params.has("nofollow")) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms / SPEED); }); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function inr(paise) {
    if (paise === null || paise === undefined) return "rejected";
    var neg = paise < 0; paise = Math.abs(Math.round(paise));
    var r = Math.floor(paise / 100), p = String(paise % 100).padStart(2, "0"), s = String(r);
    if (s.length > 3) {
      var head = s.slice(0, -3), tail = s.slice(-3), g = [];
      while (head.length > 2) { g.unshift(head.slice(-2)); head = head.slice(0, -2); }
      if (head) g.unshift(head);
      s = g.concat([tail]).join(",");
    }
    return (neg ? "-" : "") + "₹" + s + "." + p;
  }
  function crore(paise) { var c = paise / 100 / 1e7; return "₹" + c.toFixed(1) + " crore"; }
  function n(x) { return Number(x).toLocaleString("en-IN"); }
  function short(x) { return x >= 1e6 ? (x / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : x >= 1e3 ? Math.round(x / 1e3) + "k" : String(x); }
  function now() { return new Date(); }
  function clock(d) { return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  // ---------- theme ----------
  var themes = ["auto", "light", "dark"], themeIx = 0;
  try { themeIx = Math.max(0, themes.indexOf(localStorage.getItem("cs-theme") || "auto")); } catch (e) {}
  function applyTheme() {
    var t = themes[themeIx];
    if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
    document.getElementById("themeBtn").textContent = "Theme: " + t;
    try { localStorage.setItem("cs-theme", t); } catch (e) {}
  }
  document.getElementById("themeBtn").addEventListener("click", function () { themeIx = (themeIx + 1) % 3; applyTheme(); });
  applyTheme();

  // ---------- demo state ----------
  var ROLE = D.approver_role;                       // "payments lead"
  var Role = ROLE.charAt(0).toUpperCase() + ROLE.slice(1);
  var S;
  function freshState() {
    return {
      version: "bad",            // which code is in the change: "bad" or "fix"
      phase: "idle",             // idle | running | stopped | clear | approved
      steps: { tests: "pending", callers: "pending", money: "pending", signoff: "pending" },
      scanned: -1, replayed: 0, wrongSeen: 0, busy: false,
      approvedBy: null, approvedAt: null,
      audits: [], activity: [{ t: now(), cls: "run", text: "Change #" + D.change.number + " opened: " + D.change.title }]
    };
  }
  S = freshState();
  function V() { return D[S.version]; }
  function risky(v) { return v.money.wrong.length > 0 || v.callers.affected > 0; }
  function log(cls, text) { S.activity.unshift({ t: now(), cls: cls, text: text }); }

  function makeAudit(verdict) {
    var v = V(), t = now();
    var stamp = t.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    return {
      audit_id: "cs-" + D.change.number + "-" + v.commit + "-" + stamp,
      created_at: t.toISOString().replace(/\.\d+/, ""),
      pull_request: D.change.number,
      commit: v.commit,
      api: D.api,
      checks_run: {
        normal_tests: "passed (" + v.tests + " tests)",
        who_will_break: { passed: v.callers.affected === 0, callers_checked: v.callers.total,
          callers_affected: v.callers.callers.filter(function (c) { return c.affected; }).map(function (c) { return c.name; }) },
        is_the_money_right: { passed: v.money.wrong.length === 0, replayed: v.money.replayed, wrong: v.money.wrong.length,
          rule: v.money.rules[0].check }
      },
      sign_off: { needed: verdict !== "all clear", approver_role: ROLE, approved_by: S.approvedBy, approved_at: S.approvedAt },
      verdict: verdict,
      note: "Countersign demo on one sample API with made-up sample data."
    };
  }

  // ---------- router ----------
  var routes = { overview: renderOverview, change: renderChange, audit: renderAudit, how: renderHow };
  function route() {
    var name = (location.hash.replace(/^#\/?/, "").split("?")[0]) || "overview";
    if (!routes[name]) name = "overview";
    document.querySelectorAll("[data-nav]").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-nav") === name); });
    routes[name]();
    window.scrollTo(0, 0);
    return name;
  }
  window.addEventListener("hashchange", route);
  function current() { return (location.hash.replace(/^#\/?/, "").split("?")[0]) || "overview"; }

  function statusPill() {
    var p = S.phase;
    if (p === "idle") return '<span class="pill idle">Not checked yet</span>';
    if (p === "running") return '<span class="pill run">Checking…</span>';
    if (p === "stopped") return '<span class="pill bad">Stopped</span>';
    if (p === "approved") return '<span class="pill good">Approved</span>';
    return '<span class="pill good">All clear</span>';
  }
  function updateNav() {
    var c = document.getElementById("navCount");
    c.hidden = S.phase !== "stopped";
  }

  // ---------- Overview ----------
  function renderOverview() {
    var bad = D.bad;
    var rows = '<tr><td><code>' + esc(D.api) + '</code></td><td>Refunds to customers</td><td class="num">8</td><td>' + statusPill() + '</td></tr>' +
      '<tr><td><code>payments-api</code> <span class="sample">sample</span></td><td>Taking payments</td><td class="num">—</td><td><span class="pill idle">Not in this demo</span></td></tr>' +
      '<tr><td><code>payouts-api</code> <span class="sample">sample</span></td><td>Paying out merchants</td><td class="num">—</td><td><span class="pill idle">Not in this demo</span></td></tr>';
    view.innerHTML =
      '<div class="page-head"><div><h1>Overview</h1><p>A second signature before any code change that moves money goes live.</p></div>' +
      '<a class="btn primary" href="#/change">Open change #' + D.change.number + ' →</a></div>' +
      '<div class="grid kpis">' +
        kpi("Refunds replayed per change", n(bad.money.replayed), "last week, masked sample data") +
        kpi("Apps mapped from gateway logs", n(bad.callers.total), "who calls " + D.api) +
        kpi("Wrong refunds caught", n(bad.money.wrong.length), "in change #" + D.change.number) +
        kpi("Would have gone out wrongly", crore(bad.money.over_refund_paise), "sample data, one week") +
      '</div>' +
      '<div class="grid two">' +
        '<section class="card"><div class="card-h"><h2>Protected APIs</h2><span class="muted" style="font-size:13px">1 live in this demo</span></div>' +
          '<div class="tablewrap"><table><thead><tr><th>API</th><th>What it does</th><th class="num">Apps calling it</th><th>Latest change</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>' +
        '<section class="card"><div class="card-h"><h2>Activity</h2></div><ul class="feed">' + feedHtml(6) + '</ul></section>' +
      '</div>';
    updateNav();
  }
  function kpi(label, value, hint) {
    return '<div class="card kpi"><div class="label">' + esc(label) + '</div><div class="value">' + esc(value) + '</div><div class="hint">' + esc(hint) + '</div></div>';
  }
  function feedHtml(max) {
    var items = S.activity.slice(0, max || 50);
    if (!items.length) return '<li class="muted">Nothing yet.</li>';
    return items.map(function (a) {
      return '<li><span class="dot ' + a.cls + '"></span><span>' + esc(a.text) + '</span><time>' + clock(a.t) + '</time></li>';
    }).join("");
  }

  // ---------- Change page ----------
  var STEP_INFO = {
    tests: ["Normal tests", "The team's own unit tests"],
    callers: ["Who will break?", "Gateway logs × API change"],
    money: ["Is the money right?", "Replay last week's refunds"],
    signoff: ["Who signs off?", "Named approver"]
  };
  var diffTab = 0;

  function renderChange() {
    var v = V();
    view.innerHTML =
      '<div class="crumbs"><a href="#/overview">Overview</a> / Changes / #' + D.change.number + '</div>' +
      '<div class="page-head"><div>' +
        '<div class="change-head"><h1>' + esc(D.change.title) + ' <span class="muted" style="font-weight:500">#' + D.change.number + '</span></h1><span id="statusPill">' + statusPill() + '</span></div>' +
        '<div class="meta"><span>API <code>' + esc(D.api) + '</code></span><span><code>' + esc(D.change.branch) + '</code> → <code>' + esc(D.change.base) + '</code></span><span>Latest commit <code id="commitId">' + esc(v.commit) + '</code></span></div>' +
      '</div></div>' +
      '<div class="layout"><div class="stack">' +
        '<div class="card stepper" id="stepper"></div>' +
        '<div id="banner"></div>' +
        '<section class="card" id="changeCard"></section>' +
        '<section class="card check" id="chkCallers"></section>' +
        '<section class="card check" id="chkMoney"></section>' +
        '<section class="card check" id="chkSignoff"></section>' +
      '</div><div class="stack">' +
        '<section class="card controls"><div class="card-h"><h3>Demo controls</h3></div><div class="card-b">' +
          '<button class="btn primary" id="bRun" type="button">Run Countersign <kbd>R</kbd></button>' +
          '<button class="btn" id="bFix" type="button">Developer pushes a fix <kbd>F</kbd></button>' +
          '<button class="btn" id="bApprove" type="button">Payments lead approves <kbd>A</kbd></button>' +
          '<button class="btn" id="bReset" type="button">Reset demo <kbd>0</kbd></button>' +
          '<small>These buttons act out what happens on GitHub, using the results of a real run.</small>' +
        '</div></section>' +
        '<section class="card"><div class="card-b"><div class="merge"><b>Merge into main</b><button class="btn good" id="bMerge" type="button">Merge</button></div><div class="merge-note" id="mergeNote"></div></div></section>' +
        '<section class="card"><div class="card-h"><h3>Audit record</h3><span class="muted" style="font-size:12px" id="auditCount"></span></div><pre class="json" id="auditJson"></pre></section>' +
      '</div></div>';
    document.getElementById("bRun").onclick = function () { runChecks(); };
    document.getElementById("bFix").onclick = function () { pushFix(); };
    document.getElementById("bApprove").onclick = function () { approve(); };
    document.getElementById("bReset").onclick = function () { resetDemo(); };
    document.getElementById("bMerge").onclick = function () { toast("Safe to go live. (Demo only: nothing is really merged.)"); };
    renderChangeCard();
    paint();
  }

  function renderChangeCard() {
    var v = V(), el = document.getElementById("changeCard");
    if (!el) return;
    if (diffTab >= v.diff.length) diffTab = 0;
    var tabs = v.diff.map(function (f, i) {
      return '<button type="button" data-tab="' + i + '" class="' + (i === diffTab ? "on" : "") + '">' + esc(f.path.split("/").pop()) +
        ' <span class="plus">+' + f.added + '</span> <span class="minus">−' + f.removed + '</span></button>';
    }).join("");
    var f = v.diff[diffTab];
    var lines = f.lines.map(function (l) {
      var c = l.startsWith("@@") ? "h" : l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : "c";
      return '<div class="' + c + '">' + esc(l || " ") + '</div>';
    }).join("");
    var who = S.version === "bad"
      ? "A developer makes <code>amount</code> mean <b>rupees</b> instead of <b>paise</b> (₹1 = 100 paise). They update the mobile app in the same change."
      : "The fix: the API takes an explicit <code>unit</code>. Paise stays the default, so older apps keep working.";
    el.innerHTML =
      '<div class="card-h"><div><div class="q muted" style="font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em">The change</div>' +
      '<h3>' + esc(v.title) + '</h3></div><code class="muted">' + esc(v.commit) + '</code></div>' +
      '<div class="card-b" style="padding-bottom:6px"><p class="explain" style="margin:0">' + who + '</p></div>' +
      '<div class="tabs">' + tabs + '</div><div class="diff">' + lines + '</div>';
    el.querySelectorAll("[data-tab]").forEach(function (b) {
      b.onclick = function () { diffTab = +b.getAttribute("data-tab"); renderChangeCard(); };
    });
  }

  // Draws everything on the change page that depends on the state.
  function paint() {
    if (current() !== "change") { updateNav(); return; }
    var v = V(), st = S.steps;
    var pill = document.getElementById("statusPill"); if (pill) pill.innerHTML = statusPill();
    document.getElementById("commitId").textContent = v.commit;

    document.getElementById("stepper").innerHTML = ["tests", "callers", "money", "signoff"].map(function (k, i) {
      var s = st[k], icon = s === "pass" ? "✓" : s === "fail" ? "✕" : s === "warn" ? "!" : s === "running" ? "" : String(i + 1);
      var sub = STEP_INFO[k][1];
      if (k === "tests" && s === "pass") sub = v.tests + " of " + v.tests + " passed";
      if (k === "callers" && (s === "warn" || s === "pass")) sub = v.callers.affected ? v.callers.affected + " of " + v.callers.total + " apps break" : "No apps break";
      if (k === "money" && (s === "fail" || s === "pass")) sub = v.money.wrong.length ? n(v.money.wrong.length) + " refunds wrong" : "All refunds correct";
      if (k === "signoff" && s === "fail") sub = "Waiting for " + ROLE;
      if (k === "signoff" && s === "pass") sub = S.phase === "approved" ? "Approved by " + ROLE : "Not needed";
      return '<div class="step ' + (s === "pending" ? "" : s) + '"><div class="ico">' + icon + '</div><div class="txt"><b>' + STEP_INFO[k][0] + '</b><span>' + esc(sub) + '</span></div></div>';
    }).join("");

    var b = document.getElementById("banner");
    if (S.phase === "idle") b.innerHTML = '<div class="banner"><div class="big">🖊️</div><div><h2>Ready to check</h2><p>A new change to <code>' + esc(D.api) + '</code> is waiting. Press <b>Run Countersign</b>.</p></div></div>';
    else if (S.phase === "running") b.innerHTML = '<div class="banner run"><div class="big">⏳</div><div><h2>Countersign is checking this change…</h2><p>Running inside the company\'s own CI. Code and payment data never leave.</p></div></div>';
    else if (S.phase === "stopped") b.innerHTML = '<div class="banner bad"><div class="big">🛑</div><div><h2>Stopped. This change can\'t go live yet.</h2><p>All the normal tests pass, but a ₹900 refund would send <b>' + inr(v.money.wrong[0][5]) + '</b>. Fix it, or get the ' + ROLE + '\'s approval.</p></div></div>';
    else if (S.phase === "approved") b.innerHTML = '<div class="banner good"><div class="big">✅</div><div><h2>Approved by the ' + ROLE + '</h2><p>The risk was accepted by a named person, on this exact commit. It\'s in the audit record.</p></div></div>';
    else b.innerHTML = '<div class="banner good"><div class="big">✅</div><div><h2>All clear. Safe to go live.</h2><p>Every app keeps working and every replayed refund is correct.</p></div></div>';

    paintCallers(); paintMoney(); paintSignoff();

    var busy = S.busy;
    document.getElementById("bRun").disabled = busy || S.phase !== "idle";
    document.getElementById("bFix").disabled = busy || S.phase !== "stopped";
    document.getElementById("bApprove").disabled = busy || S.phase !== "stopped";
    document.getElementById("bReset").disabled = busy;
    var canMerge = S.phase === "clear" || S.phase === "approved";
    document.getElementById("bMerge").disabled = !canMerge;
    document.getElementById("mergeNote").textContent = canMerge ? "All required checks passed." :
      S.phase === "stopped" ? "Blocked: Countersign must pass first." : "Waiting for Countersign.";

    var last = S.audits[0];
    document.getElementById("auditJson").textContent = last ? JSON.stringify(last, null, 2) : "No audit record yet. One is saved every time Countersign decides.";
    document.getElementById("auditCount").textContent = S.audits.length ? S.audits.length + " saved" : "";
    updateNav();
  }

  function checkShell(el, k, question, answerHtml, body) {
    var s = S.steps[k];
    el.className = "card check" + (s === "pending" ? " pending" : "");
    el.innerHTML = '<div class="card-h"><div><div class="q">' + question + '</div><h3>' + STEP_INFO[k][1] + '</h3></div>' + (answerHtml || "") + '</div><div class="card-b">' + body + '</div>';
  }

  // Check 1: the caller map
  var mapNodes = null;
  function paintCallers() {
    var el = document.getElementById("chkCallers"), v = V(), s = S.steps.callers;
    if (!el) return;
    var callers = v.callers.callers;
    var done = s === "warn" || s === "pass";
    var answer = done ? '<div class="answer ' + (v.callers.affected ? "warn" : "good") + '">' + (v.callers.affected ? v.callers.affected + " of " + v.callers.total + " apps" : "None") + '</div>' : "";
    // map layout: hub in the middle, 8 callers around it
    var W = 600, H = 330, cx = W / 2, cy = H / 2, rx = 205, ry = 125;
    var svg = '<svg class="map" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Apps that call ' + esc(D.api) + '">';
    var pos = callers.map(function (c, i) { var a = -Math.PI / 2 + i * 2 * Math.PI / callers.length; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
    callers.forEach(function (c, i) {
      var cls = nodeClass(c, i, s);
      svg += '<line class="edge ' + cls + '" x1="' + cx + '" y1="' + cy + '" x2="' + pos[i][0].toFixed(1) + '" y2="' + pos[i][1].toFixed(1) + '"/>';
    });
    svg += '<g class="node hub"><rect x="' + (cx - 62) + '" y="' + (cy - 19) + '" width="124" height="38" rx="10"/><text x="' + cx + '" y="' + (cy + 5) + '" text-anchor="middle">' + esc(D.api) + '</text></g>';
    callers.forEach(function (c, i) {
      var w = Math.max(90, c.name.length * 8.1 + 24), x = pos[i][0] - w / 2, y = pos[i][1] - 16;
      svg += '<g class="node ' + nodeClass(c, i, s) + '"><rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="32" rx="9"/>' +
        '<text x="' + pos[i][0].toFixed(1) + '" y="' + (pos[i][1] + 5).toFixed(1) + '" text-anchor="middle">' + esc(c.name) + '</text></g>';
    });
    svg += '</svg>';
    var list = callers.map(function (c, i) {
      var seen = done || (s === "running" && i <= S.scanned);
      var tag = seen && c.affected ? '<span class="tag bad">breaks</span>' : "";
      return '<li class="' + (seen && c.affected ? "broke" : "") + '"><span class="nm">' + esc(c.name) + '</span>' + tag +
        '<span class="why">' + (seen ? esc(c.reason) + " · " + short(c.calls_per_day) + "/day" : "…") + '</span></li>';
    }).join("");
    var fc = v.callers.format_check || {};
    var fmt = done && fc.tool ? '<div class="fmt"><span class="tag good">format check passed</span> oasdiff found no breaking changes. The format looks fine. The <b>meaning</b> changed.</div>' : "";
    var lead = v.callers.affected
      ? "These apps still send <code>amount</code> in paise, but the new code reads it as rupees."
      : "Every app sends <code>amount</code> in the unit the API now expects.";
    checkShell(el, "callers", "Check 1 · Who will break?", answer,
      (s === "pending" ? '<p class="explain">Countersign compares the old and new API, then reads the company\'s gateway logs to see which apps send the changed field.</p>' :
        (done ? '<p class="explain" style="margin:0 0 10px">' + lead + '</p>' : "")) +
      (s === "pending" ? "" : '<div class="callers"><div>' + svg + '</div><ul class="callist">' + list + '</ul></div>' + fmt));
  }
  function nodeClass(c, i, s) {
    if (s === "pending") return "";
    if (s === "running") { if (i === S.scanned) return "scan"; if (i > S.scanned) return ""; }
    return c.affected ? "broke" : "ok";
  }

  // Check 2: the replay
  function paintMoney() {
    var el = document.getElementById("chkMoney"), v = V(), s = S.steps.money, m = v.money;
    if (!el) return;
    var total = m.replayed, done = s === "fail" || s === "pass";
    var replayed = done ? total : S.replayed;
    var wrongSeen = done ? m.wrong.length : S.wrongSeen;
    var answer = done ? '<div class="answer ' + (m.wrong.length ? "bad" : "good") + '">' + (m.wrong.length ? n(m.wrong.length) + " wrong" : "All correct") + '</div>' : "";
    if (s === "pending") {
      checkShell(el, "money", "Check 2 · Is the money right?", "", '<p class="explain">Countersign takes last week\'s refunds (a masked copy) and runs each one through the old code and the new code, then checks the money rules.</p>');
      return;
    }
    var okPct = total ? (replayed - wrongSeen) / total * 100 : 0, koPct = total ? wrongSeen / total * 100 : 0;
    var body =
      '<div class="counters">' +
        '<div class="counter"><div class="n" id="cReplayed">' + n(replayed) + '</div><div class="l">of ' + n(total) + ' refunds replayed</div></div>' +
        '<div class="counter good"><div class="n" id="cOk">' + n(replayed - wrongSeen) + '</div><div class="l">came out right</div></div>' +
        '<div class="counter ' + (wrongSeen ? "bad" : "") + '"><div class="n" id="cBad">' + n(wrongSeen) + '</div><div class="l">came out wrong</div></div>' +
      '</div>' +
      '<div class="bar"><div class="ok" id="barOk" style="width:' + okPct + '%"></div><div class="ko" id="barKo" style="width:' + koPct + '%"></div></div>' +
      '<div class="rule"><span class="muted">Money rule</span><code>' + esc(m.rules[0].check) + '</code><span>' + esc(m.rules[0].message) + '</span>' +
        (done ? (m.wrong.length ? ' <span class="tag bad">broken</span>' : ' <span class="tag good">holds</span>') : "") + '</div>';
    if (m.wrong.length && wrongSeen) {
      var ex = m.wrong[0];
      body += '<div class="example"><div><div class="lbl">Customer paid</div><div class="amt">' + inr(ex[3]) + '</div></div><div class="arrow">→</div>' +
        '<div><div class="lbl">Refund this change sends</div><div class="amt bad">' + inr(ex[5]) + '</div></div>' +
        '<div class="muted" style="font-size:13px">Order <code>' + esc(ex[1]) + '</code> · ' + esc(ex[2]) + '<br>100× too much: 90000 paise read as ₹90,000</div></div>';
      var shown = m.wrong.slice(0, Math.min(5, wrongSeen));
      body += '<div class="tablewrap" style="margin-top:14px;border:1px solid var(--line);border-radius:10px"><table class="rows"><thead><tr><th>Order</th><th>App</th><th class="num">Paid</th><th class="num">Old code sent</th><th class="num">This change sends</th></tr></thead><tbody>' +
        shown.map(function (w) {
          return '<tr><td><code>' + esc(w[1]) + '</code></td><td>' + esc(w[2]) + '</td><td class="num">' + inr(w[3]) + '</td><td class="num">' + inr(w[4]) + '</td><td class="num money-bad">' + inr(w[5]) + '</td></tr>';
        }).join("") + '</tbody></table></div>' +
        (done && m.wrong.length > 5 ? '<p class="explain muted" style="margin-top:8px">…and ' + n(m.wrong.length - 5) + ' more. Order ids are masked. Sample data.</p>' : "");
    }
    checkShell(el, "money", "Check 2 · Is the money right?", answer, body);
  }

  // Check 3: sign-off
  function paintSignoff() {
    var el = document.getElementById("chkSignoff"), s = S.steps.signoff, v = V();
    if (!el) return;
    var answer = s === "fail" ? '<div class="answer bad">Needs approval</div>' : s === "pass" ? '<div class="answer good">' + (S.phase === "approved" ? "Approved" : "Not needed") + '</div>' : "";
    var body;
    if (s === "pending") body = '<p class="explain">If anything is risky, the change is stopped until a named person (the ' + ROLE + ') approves this exact version. Like a bank\'s maker–checker rule.</p>';
    else if (s === "running") body = '<p class="explain">Checking who needs to sign off…</p>';
    else if (S.phase === "approved") body = approverHtml("Approved this commit at " + clock(new Date(S.approvedAt)) + ". A new commit would need a new approval.");
    else if (s === "fail") body = approverHtml("Asked to review. Until they approve, merging is blocked.");
    else body = '<p class="explain">' + (risky(v) ? "" : "Nothing risky, so no extra signature is needed. ") + 'An audit record was saved anyway.</p>';
    checkShell(el, "signoff", "Check 3 · Who signs off?", answer, body);
  }
  function approverHtml(text) {
    return '<div class="approver"><div class="avatar">PL</div><div><b>' + Role + '</b><span>' + esc(text) + '</span></div></div>';
  }

  // ---------- the story ----------
  async function runChecks() {
    if (S.busy || S.phase !== "idle") return;
    S.busy = true; S.phase = "running";
    var v = V();
    if (current() !== "change") location.hash = "#/change";
    log("run", "Countersign started checking " + (S.version === "bad" ? "change" : "the fix on") + " #" + D.change.number + " (" + v.commit + ")");
    paint();

    S.steps.tests = "running"; paint(); await sleep(900);
    S.steps.tests = "pass"; paint(); await sleep(300);

    S.steps.callers = "running"; S.scanned = -1; paint(); focusOn("chkCallers");
    for (var i = 0; i < v.callers.callers.length; i++) { S.scanned = i; paintCallers(); await sleep(320); }
    S.steps.callers = v.callers.affected ? "warn" : "pass"; paint(); await sleep(500);

    S.steps.money = "running"; S.replayed = 0; S.wrongSeen = 0; paint(); focusOn("chkMoney");
    await replayAnimation(v.money, 3200);
    S.steps.money = v.money.wrong.length ? "fail" : "pass"; paint(); await sleep(500);

    S.steps.signoff = "running"; paint(); focusOn("chkSignoff"); await sleep(800);
    if (risky(v)) {
      S.steps.signoff = "fail"; S.phase = "stopped";
      S.audits.unshift(makeAudit("stopped"));
      log("bad", "Stopped #" + D.change.number + ": " + n(v.money.wrong.length) + " refunds wrong, " + v.callers.affected + " apps break");
      log("run", "Asked the " + ROLE + " to review");
    } else {
      S.steps.signoff = "pass"; S.phase = "clear";
      S.audits.unshift(makeAudit("all clear"));
      log("good", "All clear on #" + D.change.number + " (" + v.commit + ")");
    }
    S.busy = false; paint();
    await sleep(1400); focusOn("stepper");
  }

  function replayAnimation(m, duration) {
    var total = m.replayed, wrongIdx = m.wrong.map(function (w) { return w[0]; });
    return new Promise(function (resolve) {
      var start = performance.now(), d = duration / SPEED, lastShown = 0;
      // A timer, not requestAnimationFrame, so it keeps going if the tab is in the background.
      function frame() {
        var t = performance.now();
        var p = Math.min(1, (t - start) / d);
        var eased = 1 - Math.pow(1 - p, 2);
        S.replayed = Math.round(total * eased);
        var seen = 0; while (seen < wrongIdx.length && wrongIdx[seen] < S.replayed) seen++;
        S.wrongSeen = seen;
        var shownNow = Math.min(5, seen);
        if (shownNow !== lastShown || p === 1) { paintMoney(); lastShown = shownNow; }
        else {
          var r = document.getElementById("cReplayed"); if (r) {
            r.textContent = n(S.replayed);
            document.getElementById("cOk").textContent = n(S.replayed - seen);
            document.getElementById("cBad").textContent = n(seen);
            document.getElementById("barOk").style.width = ((S.replayed - seen) / total * 100) + "%";
            document.getElementById("barKo").style.width = (seen / total * 100) + "%";
          }
        }
        if (p < 1) setTimeout(frame, 16); else resolve();
      }
      setTimeout(frame, 16);
    });
  }

  async function pushFix() {
    if (S.busy || S.phase !== "stopped") return;
    log("run", "Developer pushed a fix: " + D.fix.title);
    S.version = "fix"; S.phase = "idle"; S.approvedBy = null; S.approvedAt = null;
    S.steps = { tests: "pending", callers: "pending", money: "pending", signoff: "pending" };
    diffTab = 0; renderChangeCard(); paint(); focusOn("changeCard");
    toast("New commit pushed. Countersign runs again.");
    await sleep(1800);
    await sleep(900);
    await runChecks();
  }

  async function approve() {
    if (S.busy || S.phase !== "stopped") return;
    S.busy = true;
    S.steps.signoff = "running"; paint(); focusOn("chkSignoff"); await sleep(1000);
    S.approvedBy = ROLE; S.approvedAt = now().toISOString().replace(/\.\d+/, "");
    S.steps.signoff = "pass"; S.phase = "approved";
    S.audits.unshift(makeAudit("approved"));
    log("good", "The " + ROLE + " approved #" + D.change.number + " (" + V().commit + ")");
    S.busy = false; paint();
    await sleep(1400); focusOn("stepper");
  }

  function resetDemo() {
    if (S.busy) return;
    var audits = S.audits;
    S = freshState(); S.audits = audits; diffTab = 0;
    if (current() === "change") renderChange(); else route();
    toast("Demo reset: change #" + D.change.number + " is waiting to be checked.");
  }

  // ---------- Audit log ----------
  function renderAudit() {
    var rows = S.audits.map(function (a, i) {
      var cls = a.verdict === "stopped" ? "bad" : "good";
      return '<tr><td><code>' + esc(a.audit_id) + '</code></td><td>#' + a.pull_request + ' · <code>' + esc(a.commit) + '</code></td>' +
        '<td><span class="pill ' + cls + '">' + esc(a.verdict) + '</span></td><td>' + esc(a.sign_off.approved_by || (a.sign_off.needed ? "waiting" : "not needed")) + '</td>' +
        '<td>' + clock(new Date(a.created_at)) + '</td><td><button class="btn" type="button" data-show="' + i + '" style="padding:5px 10px;font-size:13px">View</button></td></tr>';
    }).join("");
    view.innerHTML =
      '<div class="page-head"><div><h1>Audit log</h1><p>Every decision Countersign makes is saved: what was checked, what it found, who approved, and when.</p></div></div>' +
      '<section class="card">' + (S.audits.length
        ? '<div class="tablewrap"><table><thead><tr><th>Record</th><th>Change</th><th>Verdict</th><th>Signed off by</th><th>Time</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">No records yet. Open <a href="#/change">change #' + D.change.number + '</a> and run Countersign.</div>') +
      '</section><section class="card" style="margin-top:16px" id="auditView" hidden><div class="card-h"><h3>Record</h3></div><pre class="json" id="auditViewJson"></pre></section>' +
      '<p class="muted" style="font-size:13px;margin-top:14px">On GitHub, each record is also saved as a file attached to the workflow run, and linked from the pull request comment.</p>';
    view.querySelectorAll("[data-show]").forEach(function (b) {
      b.onclick = function () {
        var box = document.getElementById("auditView"); box.hidden = false;
        document.getElementById("auditViewJson").textContent = JSON.stringify(S.audits[+b.getAttribute("data-show")], null, 2);
        box.scrollIntoView({ behavior: "smooth", block: "start" });
      };
    });
    updateNav();
  }

  // ---------- How it works ----------
  function renderHow() {
    var bad = D.bad, ex = bad.money.wrong[0];
    view.innerHTML =
      '<section class="card how-hero"><h1>A second signature before money moves</h1>' +
      '<p>A code change can pass every test and still send the wrong amount of money. Countersign is a check on every pull request. When a change could move money wrongly, it stops the change, shows the exact payment that would go wrong, and waits for a named person to sign off.</p></section>' +
      '<div class="grid three">' +
        howCard(1, "Who will break?", "Compares the old and new API, then reads the company's own gateway logs to see which apps send the changed field.",
          "Merchant dashboard and partner shopping app still send paise. The new code reads rupees.",
          "The standard format checker (oasdiff) passes this change. A number is still a number. Only the meaning changed.") +
        howCard(2, "Is the money right?", "Replays last week's real payments (a masked copy) through the old and new code, then checks money rules like \"a refund can't be more than what was paid\".",
          n(bad.money.wrong.length) + " of " + n(bad.money.replayed) + " refunds wrong. Paid " + inr(ex[3]) + " → refund sent " + inr(ex[5]) + ".",
          "Tests are written by the same developer, so they agree with the bug. Real past traffic doesn't.") +
        howCard(3, "Who signs off?", "A risky change needs a named approver, like the " + ROLE + ". Approval counts for one exact commit only. Every decision is saved in an audit record.",
          "Stopped until the " + ROLE + " approves, or the developer pushes a fix.",
          "It's the bank's maker–checker rule: one person makes a payment, a second person checks it.") +
      '</div>' +
      '<section class="card" style="margin-top:16px"><div class="card-h"><h2>Where it runs</h2></div><div class="flow">' +
        '<div class="box"><b>Developer</b>Opens a pull request</div><div class="arr">→</div>' +
        '<div class="box us"><b>Countersign</b>Runs in the company\'s own CI (GitHub Actions)</div><div class="arr">→</div>' +
        '<div class="box"><b>Reads, inside the company</b>API spec · gateway logs · masked payments</div><div class="arr">→</div>' +
        '<div class="box"><b>Result on the pull request</b>Stopped or all clear · comment · audit record</div>' +
      '</div><div class="card-b" style="padding-top:0"><p class="explain">Code and payment data never leave the company. Countersign\'s own rules run from the main branch, so a pull request can\'t switch them off.</p></div></section>' +
      '<section class="card honest"><b>Honest note:</b> this is a working demo of the idea on one sample refund API with made-up, masked sample data. It isn\'t yet a product a company can install. Every number on this site comes from really running the checks on that sample.</section>' +
      '<p style="margin-top:18px"><a class="btn primary" href="#/change">See it on change #' + D.change.number + ' →</a></p>';
    updateNav();
  }
  function howCard(num, title, how, demo, why) {
    return '<section class="card how-card"><div class="num">' + num + '</div><h3>' + esc(title) + '</h3><p>' + esc(how) + '</p>' +
      '<dl><dt>In this demo</dt><dd>' + esc(demo) + '</dd><dt>Why it matters</dt><dd>' + esc(why) + '</dd></dl></section>';
  }

  // ---------- keyboard + autoplay ----------
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if (k === "r") runChecks();
    else if (k === "f") pushFix();
    else if (k === "a") approve();
    else if (k === "0") resetDemo();
  });

  route();

  // #/change?play=fix (or play=approve) acts out the whole story by itself, for recording.
  var play = params.get("play");
  if (play && current() === "change") {
    (async function () {
      await sleep(1500); await runChecks();
      await sleep(3500);
      if (play === "approve") await approve(); else await pushFix();
    })();
  }
})();
</script>
</body>
</html>

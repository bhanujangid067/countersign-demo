<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countersign</title>
<meta name="description" content="Countersign demo: a second signature before any code change that moves money goes live.">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: a quiet working desk. Left rail, one main sheet that reads like a team conversation,
   a narrow tray for controls. The rubber stamp and the handwritten countersignature are the only loud things. */
:root {
  --paper: #f3f4ef; --sheet: #ffffff; --sheet-2: #f8f9f5; --tint: #eceee7;
  --ink: #16212c; --ink-2: #3b4854; --muted: #66727e; --rule: #e0e3da; --rule-2: #c9cec3;
  --pen: #1f3d8c; --pen-hover: #2a4ea8; --pen-soft: #e8edf8; --on-pen: #ffffff;
  --stop: #b3261e; --stop-soft: #fcefed; --stop-rule: #f0c6c1;
  --caution: #94580a; --caution-soft: #fbf3e2; --caution-rule: #ead3a2;
  --clear: #17734a; --clear-soft: #ebf6f0; --clear-rule: #bfe0cd;
  --add: #e8f5ec; --add-ink: #145c37; --del: #fbebe9; --del-ink: #8f1f17;
  --dev: #0e6e68; --lead: #a2470f;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-sign: "Mrs Saint Delafield", "Snell Roundhand", "Brush Script MT", cursive;
  --r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1418; --sheet: #161d23; --sheet-2: #1a222a; --tint: #202a32;
    --ink: #e7ebee; --ink-2: #c2cad1; --muted: #8b97a2; --rule: #26313a; --rule-2: #34414c;
    --pen: #8fb0ff; --pen-hover: #a9c2ff; --pen-soft: #1d2a45; --on-pen: #0f1418;
    --stop: #ff8a80; --stop-soft: #2c1716; --stop-rule: #5c2a26;
    --caution: #f2b552; --caution-soft: #2b2211; --caution-rule: #5a4519;
    --clear: #5fd39a; --clear-soft: #10251b; --clear-rule: #22513a;
    --add: #10281b; --add-ink: #8fe0b2; --del: #2c1616; --del-ink: #ffa49b;
    --dev: #4fc2b9; --lead: #f09a5f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1418; --sheet: #161d23; --sheet-2: #1a222a; --tint: #202a32;
  --ink: #e7ebee; --ink-2: #c2cad1; --muted: #8b97a2; --rule: #26313a; --rule-2: #34414c;
  --pen: #8fb0ff; --pen-hover: #a9c2ff; --pen-soft: #1d2a45; --on-pen: #0f1418;
  --stop: #ff8a80; --stop-soft: #2c1716; --stop-rule: #5c2a26;
  --caution: #f2b552; --caution-soft: #2b2211; --caution-rule: #5a4519;
  --clear: #5fd39a; --clear-soft: #10251b; --clear-rule: #22513a;
  --add: #10281b; --add-ink: #8fe0b2; --del: #2c1616; --del-ink: #ffa49b;
  --dev: #4fc2b9; --lead: #f09a5f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; }
a { color: var(--pen); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--font-mono); font-size: .9em; }
h1, h2, h3 { text-wrap: balance; }
.num, .tab { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.rail { padding: 22px 16px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; color: var(--ink); padding: 0 6px; }
.brand:hover { text-decoration: none; }
.org { padding: 0 6px; font-size: 13px; color: var(--muted); line-height: 1.4; }
.org b { display: block; color: var(--ink); font-weight: 600; font-size: 14px; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--ink-2); font-weight: 500; font-size: 14.5px; }
.nav a:hover { background: var(--tint); text-decoration: none; }
.nav a.on { background: var(--sheet); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--rule); }
.nav .badge { margin-left: auto; min-width: 20px; text-align: center; font-size: 12px; font-weight: 600; padding: 0 6px; border-radius: 10px; background: var(--stop); color: var(--sheet); }
.team { display: flex; flex-direction: column; gap: 10px; padding: 0 6px; }
.team h4 { margin: 0; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.who { display: flex; align-items: center; gap: 10px; font-size: 13.5px; line-height: 1.3; }
.who span { color: var(--muted); font-size: 12.5px; display: block; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 6px; font-size: 12px; color: var(--muted); line-height: 1.45; }
.theme-btn { align-self: flex-start; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink-2); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; }

.main { padding: 30px 36px 72px; max-width: 1260px; width: 100%; min-width: 0; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.crumbs a { color: var(--muted); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { font-size: 28px; line-height: 1.2; letter-spacing: -.02em; margin: 0; font-weight: 600; }
.page-head p { margin: 6px 0 0; color: var(--ink-2); font-size: 16px; max-width: 62ch; }

/* ---------- pieces ---------- */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); min-width: 0; }
.sheet-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 18px 12px; border-bottom: 1px solid var(--rule); }
.sheet-h h2, .sheet-h h3 { margin: 0; font-size: 15px; font-weight: 600; }
.sheet-h .aside { font-size: 13px; color: var(--muted); }
.sheet-b { padding: 16px 18px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sample { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); border: 1px dashed var(--rule-2); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.muted { color: var(--muted); }

.av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--sheet); }
.av.dev { background: var(--dev); } .av.lead { background: var(--lead); } .av.bot { background: var(--pen); color: var(--on-pen); border-radius: 8px; }
.av.lg { width: 38px; height: 38px; font-size: 14px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 5px; white-space: nowrap; border: 1px solid var(--rule-2); color: var(--muted); background: var(--sheet-2); }
.pill.run { color: var(--pen); background: var(--pen-soft); border-color: transparent; }
.pill.run::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1s infinite; }
.pill.stop { color: var(--stop); background: var(--stop-soft); border-color: var(--stop-rule); }
.pill.caution { color: var(--caution); background: var(--caution-soft); border-color: var(--caution-rule); }
.pill.clear { color: var(--clear); background: var(--clear-soft); border-color: var(--clear-rule); }
.pill.signed { color: var(--pen); background: var(--pen-soft); border-color: transparent; }
@keyframes pulse { 50% { opacity: .25; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); transition: background .15s, border-color .15s; }
.btn:hover:not(:disabled) { background: var(--sheet-2); border-color: var(--muted); }
.btn.primary { background: var(--pen); color: var(--on-pen); border-color: var(--pen); }
.btn.primary:hover:not(:disabled) { background: var(--pen-hover); border-color: var(--pen-hover); }
.btn.go { background: var(--clear); color: var(--sheet); border-color: var(--clear); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn kbd { font: 500 11px var(--font-mono); opacity: .65; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 18px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
th { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.over { color: var(--stop); font-weight: 600; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 16px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 10; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- stamps and signatures (the loud bit) ---------- */
.stamp { display: inline-block; font: 700 15px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; padding: 9px 14px 8px; color: var(--stop);
  border: 2.5px solid currentColor; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--sheet), inset 0 0 0 3.5px currentColor; transform: rotate(-5deg); white-space: nowrap; }
.stamp.clear { color: var(--clear); } .stamp.signed { color: var(--pen); }
.stamp.thud { animation: thud .45s cubic-bezier(.2, .9, .3, 1.2) both; }
@keyframes thud { from { transform: rotate(-5deg) scale(1.8); opacity: 0; } to { transform: rotate(-5deg) scale(1); opacity: 1; } }
.signature { font-family: var(--font-sign); font-size: 52px; line-height: 1; color: var(--pen); white-space: nowrap; padding: 0 6px; }
.signature.write { animation: write 1.6s steps(28) both; }
@keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.sigline { border-top: 1px solid var(--rule-2); margin-top: -6px; padding-top: 6px; font-size: 12.5px; color: var(--muted); }

/* ---------- overview ---------- */
.figures { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.figure { padding: 16px 20px; border-left: 1px solid var(--rule); }
.figure:first-child { border-left: 0; }
.figure .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.figure .l { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.figure .h { font-size: 12px; color: var(--muted); }
.figure.alert .v { color: var(--stop); }
.attention { display: flex; align-items: center; gap: 14px; padding: 16px 18px; flex-wrap: wrap; }
.attention .what { flex: 1 1 260px; min-width: 0; }
.attention .what b { display: block; font-size: 15.5px; }
.attention .what span { color: var(--muted); font-size: 13.5px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.feed { list-style: none; margin: 0; padding: 6px 0; }
.feed li { display: flex; gap: 12px; padding: 9px 18px; font-size: 14px; align-items: flex-start; }
.feed li .t { min-width: 0; flex: 1; }
.feed time { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 2px; }
.feed .av { width: 24px; height: 24px; font-size: 10px; }

/* ---------- change page ---------- */
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); font-size: 14px; margin-top: 10px; }
.meta .by { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
.meta .av { width: 22px; height: 22px; font-size: 9.5px; }
.ref { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); background: var(--tint); padding: 1px 6px; border-radius: 4px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.tray { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 20px; }

.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative; }
.step { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; min-width: 0; border-left: 1px solid var(--rule); }
.step:first-child { border-left: 0; }
.step .ico { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--rule-2); color: var(--muted); font: 600 12px var(--font-ui); background: var(--sheet); margin-top: 1px; }
.step .ico svg { width: 13px; height: 13px; }
.step .txt { min-width: 0; }
.step .txt b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .txt span { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.running .ico { border-color: var(--pen); border-top-color: transparent; animation: spin .8s linear infinite; }
.step.pass .ico { border-color: var(--clear); background: var(--clear); color: var(--sheet); }
.step.warn .ico { border-color: var(--caution); background: var(--caution); color: var(--sheet); }
.step.fail .ico { border-color: var(--stop); background: var(--stop); color: var(--sheet); }
.step.pass .txt span { color: var(--clear); } .step.warn .txt span { color: var(--caution); } .step.fail .txt span { color: var(--stop); }
@keyframes spin { to { transform: rotate(360deg); } }

.verdict { display: flex; align-items: center; gap: 30px; padding: 20px 24px; scroll-margin-top: 16px; }
.verdict .stamp { flex: none; margin-left: 4px; }
.verdict h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.verdict p { margin: 4px 0 0; color: var(--ink-2); max-width: 64ch; }
.verdict.stop { background: var(--stop-soft); border-color: var(--stop-rule); }
.verdict.clear { background: var(--clear-soft); border-color: var(--clear-rule); }
.verdict.signed { background: var(--pen-soft); border-color: transparent; }
.verdict .spinner { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--pen); border-top-color: transparent; animation: spin .8s linear infinite; }

/* conversation */
.thread { position: relative; display: flex; flex-direction: column; gap: 18px; }
.thread::before { content: ""; position: absolute; left: 18px; top: 10px; bottom: 10px; width: 2px; background: var(--rule); }
.post { position: relative; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; scroll-margin-top: 16px; }
.post > .av { position: relative; z-index: 1; box-shadow: 0 0 0 4px var(--paper); }
.post-h { font-size: 14px; color: var(--muted); margin: 8px 0 8px; }
.post-h b { color: var(--ink); font-weight: 600; }
.say { font-size: 15px; color: var(--ink); padding: 14px 18px; }
.say p { margin: 0; max-width: 68ch; }
.say p + p { margin-top: 8px; }
.event { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); padding-left: 52px; position: relative; }
.event::before { content: ""; position: absolute; left: 13px; width: 12px; height: 12px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--rule-2); }
.event b { color: var(--ink-2); font-weight: 600; }

/* diff */
.tabs { display: flex; gap: 2px; padding: 0 12px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); overflow-x: auto; background: var(--sheet-2); }
.tabs button { border: 0; background: none; padding: 9px 10px 8px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted); font: 500 12.5px var(--font-mono); white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--pen); }
.tabs .plus { color: var(--clear); } .tabs .minus { color: var(--stop); }
.diff { font: 12.5px/1.65 var(--font-mono); overflow: auto; max-height: 240px; border-radius: 0 0 var(--r) var(--r); }
.diff div { white-space: pre; padding: 0 16px; min-width: max-content; }
.diff .a { background: var(--add); color: var(--add-ink); }
.diff .d { background: var(--del); color: var(--del-ink); }
.diff .h { color: var(--muted); padding-top: 5px; padding-bottom: 5px; }
.diff .c { color: var(--ink-2); }

/* checks */
.checks { display: flex; flex-direction: column; }
.check { border-top: 1px solid var(--rule); padding: 16px 18px 18px; scroll-margin-top: 16px; }
.check:first-child { border-top: 0; }
.check.pending { opacity: .5; }
.check-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.check-h h3 { margin: 2px 0 0; font-size: 16.5px; font-weight: 600; }
.answer { font-size: 20px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.answer.stop { color: var(--stop); } .answer.caution { color: var(--caution); } .answer.clear { color: var(--clear); } .answer.signed { color: var(--pen); }
.explain { font-size: 14.5px; color: var(--ink-2); margin: 8px 0 0; max-width: 70ch; }

.callers { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: center; margin-top: 12px; }
.map { width: 100%; height: auto; display: block; }
.map .edge { stroke: var(--rule-2); stroke-width: 1.5; transition: stroke .3s; }
.map .edge.scan { stroke: var(--pen); stroke-width: 2; }
.map .edge.ok { stroke: var(--clear); opacity: .45; }
.map .edge.broke { stroke: var(--stop); stroke-width: 2.5; stroke-dasharray: 6 5; }
.map .node rect { fill: var(--sheet); stroke: var(--rule-2); stroke-width: 1.2; transition: fill .3s, stroke .3s; }
.map .node text { fill: var(--ink-2); font: 500 14px var(--font-ui); }
.map .node.scan rect { stroke: var(--pen); fill: var(--pen-soft); }
.map .node.ok rect { stroke: var(--clear-rule); }
.map .node.broke rect { stroke: var(--stop); fill: var(--stop-soft); stroke-width: 2; }
.map .node.broke text { fill: var(--stop); font-weight: 600; }
.map .hub rect { fill: var(--ink); stroke: var(--ink); }
.map .hub text { fill: var(--paper); font: 600 14px var(--font-mono); }
.callist { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.callist li { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.callist li:last-child { border-bottom: 0; }
.callist .nm { font-weight: 500; }
.callist .why { color: var(--muted); font-size: 12.5px; margin-left: auto; text-align: right; }
.callist li.broke .nm { color: var(--stop); font-weight: 600; }
.chip { font-size: 11px; font-weight: 600; letter-spacing: .03em; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.chip.stop { background: var(--stop); color: var(--sheet); }
.chip.clear { color: var(--clear); border: 1px solid var(--clear-rule); background: var(--clear-soft); }
.fmt { margin-top: 12px; font-size: 13.5px; color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; }
.fmt .chip { flex: none; }

.counters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--rule); border-radius: var(--r); margin-top: 14px; }
.counter { padding: 12px 16px; border-left: 1px solid var(--rule); }
.counter:first-child { border-left: 0; }
.counter .n { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.2; }
.counter .l { font-size: 12.5px; color: var(--muted); }
.counter.stop .n { color: var(--stop); } .counter.clear .n { color: var(--clear); }
.bar { height: 6px; border-radius: 3px; background: var(--tint); overflow: hidden; margin: 12px 0 4px; display: flex; }
.bar .ok { background: var(--clear); width: 0; }
.bar .ko { background: var(--stop); width: 0; }
.rule { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; font-size: 14px; color: var(--ink-2); }
.rule code { background: var(--tint); padding: 2px 7px; border-radius: 4px; color: var(--ink); }
.receipt { margin-top: 14px; display: grid; grid-template-columns: auto auto auto 1fr; align-items: center; gap: 6px 18px; padding: 14px 18px; border-radius: var(--r); background: var(--stop-soft); border: 1px solid var(--stop-rule); }
.receipt .lbl { font-size: 12px; color: var(--muted); }
.receipt .amt { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.receipt .amt.over { color: var(--stop); }
.receipt .arrow { color: var(--muted); font-size: 20px; }
.receipt .note { font-size: 13px; color: var(--ink-2); justify-self: end; text-align: right; }
.rows { margin-top: 12px; border: 1px solid var(--rule); border-radius: var(--r); }
.rows th, .rows td { padding: 8px 14px; }

.signoff { display: flex; align-items: flex-end; gap: 18px 28px; flex-wrap: wrap; margin-top: 12px; }
.person { display: flex; align-items: center; gap: 12px; }
.person b { display: block; font-weight: 600; }
.person span { color: var(--muted); font-size: 13.5px; }

/* tray */
.tray .sheet-b { display: flex; flex-direction: column; gap: 8px; }
.tray .btn { width: 100%; justify-content: space-between; }
.tray small { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.mergecard { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.mergecard .head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.mergecard .head svg { color: var(--muted); }
.reqs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; }
.reqs li { display: flex; align-items: center; gap: 9px; color: var(--ink-2); }
.reqs .dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 1.5px solid var(--rule-2); color: var(--muted); background: var(--sheet); }
.reqs .dot svg { width: 11px; height: 11px; }
.reqs li.ok .dot { background: var(--clear); border-color: var(--clear); color: var(--sheet); }
.reqs li.no .dot { background: var(--stop); border-color: var(--stop); color: var(--sheet); }
.reqs li.no { color: var(--stop); font-weight: 500; }
.reqs li .st { margin-left: auto; font-size: 12px; color: var(--muted); }
.merge-btn { width: 100%; justify-content: center !important; padding: 11px 14px; font-size: 15px; position: relative; overflow: hidden; }
.merge-btn > * { position: relative; }
.merge-btn.locked { background: var(--sheet-2); color: var(--muted); border-style: dashed; cursor: not-allowed; }
.merge-btn.locked:hover { background: var(--sheet-2) !important; border-color: var(--rule-2) !important; }
.merge-btn.ready { background: var(--clear); border-color: var(--clear); color: var(--sheet); box-shadow: 0 0 0 4px var(--clear-soft); }
.merge-btn.ready:hover { background: var(--clear) !important; border-color: var(--clear) !important; filter: brightness(1.08); }
.merge-btn.working, .merge-btn.done { background: var(--pen); border-color: var(--pen); color: var(--on-pen); cursor: default; }
.merge-btn .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--pen-hover); }
.merge-btn.working .fill { width: 100%; transition: width 1.1s ease-in-out; }
#mergeNote { transition: color .2s; }
#mergeNote.flash { color: var(--stop); font-weight: 600; }
.shake { animation: shake .42s; }
@keyframes shake { 15%, 55% { transform: translateX(-7px); } 35%, 75% { transform: translateX(7px); } }

.verdict.merged { background: var(--sheet); border-color: var(--pen); box-shadow: inset 4px 0 0 var(--pen); }
.graph { flex: none; width: 236px; max-width: 100%; height: auto; overflow: visible; }
.graph .main { stroke: var(--rule-2); stroke-width: 4; stroke-linecap: round; fill: none; }
.graph .main.after { stroke: var(--pen); }
.graph .branch { stroke: var(--pen); stroke-width: 4; fill: none; stroke-linecap: round; }
.graph .commit { fill: var(--sheet); stroke: var(--pen); stroke-width: 3; }
.graph .mergept { fill: var(--pen); }
.graph .ring { fill: none; stroke: var(--pen); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ring 1.8s ease-out 1.2s infinite; opacity: 0; }
.graph text { font: 500 11.5px var(--font-mono); fill: var(--muted); }
.graph text.b { fill: var(--pen); }
.graph.animate .branch { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.1s ease-in-out forwards; }
.graph.animate .main.after { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .35s ease-out 1.1s forwards; }
.graph.animate .c1 { opacity: 0; animation: pop .25s ease .45s forwards; }
.graph.animate .c2 { opacity: 0; animation: pop .25s ease .7s forwards; }
.graph.animate .mergept { opacity: 0; animation: pop .3s cubic-bezier(.2, .9, .3, 1.4) 1.05s forwards; transform-box: fill-box; transform-origin: center; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
@keyframes ring { 0% { transform: scale(.8); opacity: .9; } 100% { transform: scale(3); opacity: 0; } }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--clear); margin-bottom: 4px; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px var(--clear-soft); animation: pulse 1.2s infinite; }
.pill.merged { color: var(--on-pen); background: var(--pen); border-color: var(--pen); }
.event.merged::before { background: var(--pen); border-color: var(--pen); }
.event.merged b.m { color: var(--pen); }
pre.json { margin: 0; padding: 14px 16px; font: 11.5px/1.55 var(--font-mono); color: var(--ink-2); background: var(--sheet-2); max-height: 300px; overflow: auto; border-radius: 0 0 var(--r) var(--r); white-space: pre-wrap; word-break: break-word; }

/* audit log: a record you could print and file */
.audit-layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 22px; align-items: start; }
.reclist { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.reclist button { width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 6px; cursor: pointer; display: grid; gap: 3px; }
.reclist button:hover { background: var(--sheet-2); }
.reclist button.on { background: var(--pen-soft); }
.reclist .r1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.reclist .r2 { font: 12px var(--font-mono); color: var(--muted); }
.doc { padding: 36px 44px 28px; max-width: 860px; }
.doc-h { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
.lh { display: flex; gap: 12px; align-items: center; }
.lh b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.lh span { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.doc-id { margin-top: 14px; font-size: 13px; color: var(--muted); }
.doc-id code { color: var(--ink-2); }
.doc-title { font-size: 23px; margin: 4px 0 16px; font-weight: 600; letter-spacing: -.01em; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 22px; margin: 0 0 18px; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.facts .av { width: 22px; height: 22px; font-size: 9.5px; }
.doc-s { padding: 18px 0; border-top: 1px solid var(--rule); }
.doc-s h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 16px; font-weight: 600; }
.doc-s h3 .n { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 1.5px solid var(--ink-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.doc-s h3 .res { margin-left: auto; font-size: 13px; font-weight: 600; white-space: nowrap; }
.res.ok { color: var(--clear); } .res.no { color: var(--stop); } .res.warn { color: var(--caution); } .res.signed { color: var(--pen); }
.doc-s p { margin: 4px 0; max-width: 70ch; color: var(--ink-2); font-size: 14.5px; }
.doc-s ul { margin: 8px 0 4px; padding-left: 20px; font-size: 14.5px; color: var(--ink-2); display: grid; gap: 4px; }
.doc-s ul b { color: var(--ink); font-weight: 600; }
.doc .tablewrap { margin-top: 10px; border: 1px solid var(--rule); border-radius: var(--r); }
.doc th, .doc td { padding: 8px 14px; font-size: 13.5px; }
.sig { margin-top: 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: end; }
.sig-block { display: flex; flex-direction: column; min-width: 0; }
.sig-block .signature { font-size: 50px; padding: 0 4px; }
.sig-empty { height: 52px; }
.sig-block .sigline { margin-top: -4px; line-height: 1.5; }
.sig-block .sigline b { color: var(--ink); font-weight: 600; }
.sig-statement { font-size: 13.5px; color: var(--ink-2); margin: 0; }
.doc-foot { margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; }
details.raw summary { cursor: pointer; color: var(--pen); font-weight: 500; font-size: 13px; }
details.raw pre { margin-top: 8px; border-radius: var(--r); border: 1px solid var(--rule); }
.mini { display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.mini .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mini code { font-size: 11.5px; color: var(--muted); word-break: break-all; }
.mini .signature { font-size: 34px; padding: 0; }
.mini .sigline { margin-top: -4px; font-size: 12px; }

/* how it works */
.lede { font-size: 19px; line-height: 1.5; color: var(--ink); max-width: 60ch; margin: 0; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 22px; }
.how { padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
.how h3 { margin: 0; font-size: 18px; font-weight: 600; }
.how p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.how dl { margin: 6px 0 0; font-size: 14px; display: grid; gap: 8px; }
.how dt { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.how dd { margin: 2px 0 0; }
.flow { display: flex; align-items: stretch; flex-wrap: wrap; gap: 0; padding: 18px; }
.flow .box { flex: 1 1 160px; border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; background: var(--sheet-2); font-size: 14px; }
.flow .box b { display: block; margin-bottom: 2px; }
.flow .box.us { border-color: var(--pen); background: var(--pen-soft); }
.flow .arr { flex: none; display: grid; place-items: center; width: 30px; color: var(--muted); }
.analogy { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 20px 22px; }
.analogy p { margin: 0; font-size: 16px; max-width: 62ch; }

/* ---------- small screens ---------- */
@media (max-width: 1120px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .tray { position: static; }
  .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .figure:nth-child(3) { border-left: 0; }
  .figure:nth-child(n+3) { border-top: 1px solid var(--rule); }
}
@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 14px; border-right: 0; border-bottom: 1px solid var(--rule);
    padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .org, .team, .rail-foot span { display: none; }
  .rail-foot { margin: 0 0 0 auto; padding: 0; }
  .nav { flex-direction: row; overflow-x: auto; width: 100%; order: 3; }
  .nav a { white-space: nowrap; }
  .main { padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .cols, .three, .callers { grid-template-columns: minmax(0, 1fr); }
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .step:nth-child(3) { border-left: 0; }
  .step:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .verdict { flex-direction: column; align-items: flex-start; gap: 14px; }
  .receipt { grid-template-columns: auto auto 1fr; }
  .receipt .note { grid-column: 1 / -1; justify-self: start; text-align: left; }
  .counter .n { font-size: 20px; }
  .counter { padding: 10px 12px; }
  th, td { padding: 9px 12px; }
  .flow { flex-direction: column; }
  .flow .arr { width: auto; height: 24px; transform: rotate(90deg); }
  .analogy { grid-template-columns: minmax(0, 1fr); }
  .thread::before { left: 14px; }
  .post { grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
  .post > .av.lg { width: 30px; height: 30px; font-size: 11px; }
  .event { padding-left: 40px; }
  .event::before { left: 9px; }
  .signature { font-size: 42px; }
  .audit-layout { grid-template-columns: minmax(0, 1fr); }
  .doc { padding: 22px 18px 18px; }
  .doc-title { font-size: 19px; }
  .sig { grid-template-columns: minmax(0, 1fr); }
  .doc-h .stamp { font-size: 12px; padding: 7px 10px 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <a class="brand" href="#/overview" aria-label="Countersign home">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <rect width="28" height="28" rx="7" fill="var(--pen)"/>
        <path d="M6 17.5c2.2-5.6 4.4-8.4 6-8.4 2 0-.6 7.6 1.4 7.6 1.6 0 2.8-4.2 4.4-4.2 1.2 0 .8 3 2 3 .9 0 1.7-.8 2.4-1.8" fill="none" stroke="var(--on-pen)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6.5 21h15" stroke="var(--on-pen)" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
      </svg>
      Countersign
    </a>
    <div class="org"><b>Sample Payments Co.</b>Demo workspace with made-up data</div>
    <nav class="nav" aria-label="Main">
      <a href="#/overview" data-nav="overview">Overview</a>
      <a href="#/change" data-nav="change">Changes <span class="badge" id="navCount" hidden>1</span></a>
      <a href="#/audit" data-nav="audit">Audit log</a>
      <a href="#/how" data-nav="how">How it works</a>
    </nav>
    <div class="team">
      <h4>Team</h4>
      <div class="who"><div class="av dev">RM</div><div>Rohan Mehta<span>Developer</span></div></div>
      <div class="who"><div class="av lead">AI</div><div>Ananya Iyer<span>Payments lead</span></div></div>
    </div>

      <button class="theme-btn" id="themeBtn" type="button">Theme: light</button>
      <span>A demo on one sample API. People and payments here are made up.</span>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var D = window.COUNTERSIGN;
  var view = document.getElementById("view");
  if (!D) {
    view.innerHTML = '<div class="sheet sheet-b">Missing <code>data.js</code>. Run <code>scripts/demo_local.sh</code> to create it.</div>';
    return;
  }

  // ---------- helpers ----------
  var params = new URLSearchParams((location.hash.split("?")[1]) || "");
  var SPEED = Math.max(0.2, Math.min(3, parseFloat(params.get("speed")) || 1));
  // Recording mode (#/...?steps): each check waits to be released, so a voiceover can finish first.
  var STEP_MODE = params.has("steps"), gates = {};
  function gate(name) {
    if (!STEP_MODE) return Promise.resolve();
    return new Promise(function (resolve) { gates[name] = resolve; window.__waitingFor = name; });
  }
  window.__release = function (name) { if (gates[name]) { var r = gates[name]; delete gates[name]; window.__waitingFor = null; r(); } };
  window.__setSpeed = function (x) { SPEED = x; };
  function focusOn(id) {
    if (current() !== "change") return;
    var el = document.getElementById(id);
    if (el && !params.has("nofollow")) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms / SPEED); }); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function inr(paise) {
    if (paise === null || paise === undefined) return "rejected";
    var neg = paise < 0; paise = Math.abs(Math.round(paise));
    var r = Math.floor(paise / 100), p = String(paise % 100).padStart(2, "0"), s = String(r);
    if (s.length > 3) {
      var head = s.slice(0, -3), tail = s.slice(-3), g = [];
      while (head.length > 2) { g.unshift(head.slice(-2)); head = head.slice(0, -2); }
      if (head) g.unshift(head);
      s = g.concat([tail]).join(",");
    }
    return (neg ? "-" : "") + "₹" + s + "." + p;
  }
  function crore(paise) { return "₹" + (paise / 100 / 1e7).toFixed(1) + " crore"; }
  function n(x) { return Number(x).toLocaleString("en-IN"); }
  function short(x) { return x >= 1e6 ? (x / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : x >= 1e3 ? Math.round(x / 1e3) + "k" : String(x); }
  function now() { return new Date(); }
  function clock(d) { return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  function longDate(d) { return d.toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" }) + ", " + clock(d); }
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }
  var ICON = {
    pass: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.4l2.6 2.6L11 4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    fail: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M4 4l6 6M10 4l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    warn: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 3.5v4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="7" cy="10.6" r="1.1" fill="currentColor"/></svg>',
    lock: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6.5" rx="1.5" fill="currentColor"/><path d="M4.5 6V4.5a2.5 2.5 0 0 1 5 0V6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
    branch: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="3.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="4" cy="12.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="6" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 5.3v5.4M12 7.8c0 2.4-3 2.6-6.4 3.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    arrow: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  // ---------- people (made-up teammates in the sample workspace) ----------
  var DEV = { name: "Rohan Mehta", first: "Rohan", role: "Developer", initials: "RM", cls: "dev" };
  var LEAD = { name: "Ananya Iyer", first: "Ananya", role: "Payments lead", initials: "AI", cls: "lead" };
  function av(p, size) { return '<div class="av ' + p.cls + (size ? " " + size : "") + '" aria-hidden="true">' + p.initials + '</div>'; }
  var BOT = '<div class="av bot lg" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 28 28"><path d="M5 17.5c2.2-5.6 4.4-8.4 6-8.4 2 0-.6 7.6 1.4 7.6 1.6 0 2.8-4.2 4.4-4.2 1.2 0 .8 3 2 3 .9 0 1.7-.8 2.4-1.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';

  // ---------- theme ----------
  // Light by default (it reads best on a projector). The button cycles to dark, then to the computer's own setting.
  var themes = ["light", "dark", "auto"], themeIx = 0;
  try { themeIx = Math.max(0, themes.indexOf(localStorage.getItem("cs-theme") || "light")); } catch (e) {}
  function applyTheme() {
    var t = themes[themeIx];
    if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
    document.getElementById("themeBtn").textContent = "Theme: " + t;
    try { localStorage.setItem("cs-theme", t); } catch (e) {}
  }
  document.getElementById("themeBtn").addEventListener("click", function () { themeIx = (themeIx + 1) % 3; applyTheme(); });
  applyTheme();

  // ---------- demo state ----------
  var ROLE = D.approver_role;                       // "payments lead"
  var S;
  function freshState() {
    var opened = new Date(Date.now() - 6 * 60 * 1000);
    return {
      version: "bad",            // which code is in the change: "bad" or "fix"
      phase: "idle",             // idle | running | stopped | clear | approved
      steps: { tests: "pending", callers: "pending", money: "pending", signoff: "pending" },
      scanned: -1, replayed: 0, wrongSeen: 0, busy: false,
      opened: opened, fixedAt: null, askedAt: null, approvedBy: null, approvedAt: null, justSigned: false, justStamped: false,
      auditSel: 0,
      audits: [], activity: [{ t: opened, who: DEV, text: "opened change #" + D.change.number + ": " + D.change.title }]
    };
  }
  S = freshState();
  function V() { return D[S.version]; }
  function risky(v) { return v.money.wrong.length > 0 || v.callers.affected > 0; }
  function log(who, text) { S.activity.unshift({ t: now(), who: who, text: text }); }

  function makeAudit(verdict) {

  function paintCallers() {

    var svg = '<svg class="map" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Apps that call ' + esc(D.api) + '">';
    callers.forEach(function (c, i) {
      svg += '<line class="edge ' + nodeClass(c, i, s) + '" x1="' + cx + '" y1="' + cy + '" x2="' + pos[i][0].toFixed(1) + '" y2="' + pos[i][1].toFixed(1) + '"/>';
    });
    svg += '<g class="node hub"><rect x="' + (cx - 62) + '" y="' + (cy - 19) + '" width="124" height="38" rx="8"/><text x="' + cx + '" y="' + (cy + 5) + '" text-anchor="middle">' + esc(D.api) + '</text></g>';
    callers.forEach(function (c, i) {
      var w = Math.max(90, c.name.length * 8.1 + 24), x = pos[i][0] - w / 2, y = pos[i][1] - 16;
      svg += '<g class="node ' + nodeClass(c, i, s) + '"><rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="32" rx="7"/>' +
        '<text x="' + pos[i][0].toFixed(1) + '" y="' + (pos[i][1] + 5).toFixed(1) + '" text-anchor="middle">' + esc(c.name) + '</text></g>';
    });
    svg += '</svg>';
    var list = callers.map(function (c, i) {
      var seen = done || i <= S.scanned;
      return '<li class="' + (seen && c.affected ? "broke" : "") + '"><span class="nm">' + esc(c.name) + '</span>' + (seen && c.affected ? '<span class="chip stop">breaks</span>' : "") +
        '<span class="why">' + (seen ? esc(c.reason) + " · " + short(c.calls_per_day) + "/day" : "checking…") + '</span></li>';
    }).join("");
    var lead = !done ? "" : v.callers.affected
      ? '<p class="explain">These two apps still send <code>amount</code> in paise, but the new code reads it as rupees.</p>'
      : '<p class="explain">Every app sends <code>amount</code> in the unit the API now expects.</p>';
    var fc = v.callers.format_check || {};
    var fmt = done && fc.tool ? '<div class="fmt"><span class="chip clear">format check passed</span><span>The standard API checker (oasdiff) found nothing wrong. A number is still a number. Only its meaning changed.</span></div>' : "";
    checkShell(el, "callers", 1, answer, lead + '<div class="callers"><div>' + svg + '</div><ul class="callist">' + list + '</ul></div>' + fmt);
  }
  function nodeClass(c, i, s) {
    if (s === "pending") return "";
    if (s === "running") { if (i === S.scanned) return "scan"; if (i > S.scanned) return ""; }
    return c.affected ? "broke" : "ok";
  }

  // Check 2: the replay
  function paintMoney() {
    var el = document.getElementById("chkMoney"), v = V(), s = S.steps.money, m = v.money;
    if (!el) return;
    if (s === "pending") {
      checkShell(el, "money", 2, "", '<p class="explain">Countersign takes last week\'s refunds (a masked copy), runs each one through the old code and the new code, and checks the money rules.</p>');
      return;
    }
    var total = m.replayed, done = s === "fail" || s === "pass";
    var replayed = done ? total : S.replayed, wrongSeen = done ? m.wrong.length : S.wrongSeen;
    var answer = done ? '<div class="answer ' + (m.wrong.length ? "stop" : "clear") + '">' + (m.wrong.length ? n(m.wrong.length) + " refunds wrong" : "All correct") + '</div>' : "";
    var body =
      '<div class="counters">' +
        '<div class="counter"><div class="n" id="cReplayed">' + n(replayed) + '</div><div class="l">of ' + n(total) + ' replayed</div></div>' +
        '<div class="counter clear"><div class="n" id="cOk">' + n(replayed - wrongSeen) + '</div><div class="l">came out right</div></div>' +
        '<div class="counter ' + (wrongSeen ? "stop" : "") + '"><div class="n" id="cBad">' + n(wrongSeen) + '</div><div class="l">came out wrong</div></div>' +
      '</div>' +
      '<div class="bar" aria-hidden="true"><div class="ok" id="barOk" style="width:' + ((replayed - wrongSeen) / total * 100) + '%"></div><div class="ko" id="barKo" style="width:' + (wrongSeen / total * 100) + '%"></div></div>' +
      '<div class="rule">Money rule <code>' + esc(m.rules[0].check) + '</code><span>' + esc(m.rules[0].message) + '</span>' +
        (done ? (m.wrong.length ? '<span class="chip stop">broken</span>' : '<span class="chip clear">holds</span>') : "") + '</div>';
    if (m.wrong.length && wrongSeen) {
      var ex = m.wrong[0];
      body += '<div class="receipt"><div><div class="lbl">Customer paid</div><div class="amt">' + inr(ex[3]) + '</div></div><div class="arrow">→</div>' +
        '<div><div class="lbl">This change refunds</div><div class="amt over">' + inr(ex[5]) + '</div></div>' +
        '<div class="note">Order <code>' + esc(ex[1]) + '</code> · ' + esc(ex[2]) + '<br>100 times too much: 90000 paise read as ₹90,000</div></div>';
      var shown = m.wrong.slice(0, Math.min(5, wrongSeen));
      body += '<div class="tablewrap rows"><table><thead><tr><th>Order</th><th>App</th><th class="num">Paid</th><th class="num">Old code sent</th><th class="num">This change sends</th></tr></thead><tbody>' +
        shown.map(function (w) {
          return '<tr><td><code>' + esc(w[1]) + '</code></td><td>' + esc(w[2]) + '</td><td class="num">' + inr(w[3]) + '</td><td class="num">' + inr(w[4]) + '</td><td class="num over">' + inr(w[5]) + '</td></tr>';
        }).join("") + '</tbody></table></div>' +
        (done && m.wrong.length > 5 ? '<p class="explain muted" style="font-size:13px">And ' + n(m.wrong.length - 5) + ' more. Order numbers are masked, and all of it is sample data.</p>' : "");
    }
    checkShell(el, "money", 2, answer, body);
  }

  // Check 3: sign-off
  function paintSignoff() {
    var el = document.getElementById("chkSignoff"), s = S.steps.signoff, v = V();
    if (!el) return;
    var answer = s === "fail" ? '<div class="answer stop">Needs ' + LEAD.first + '</div>'
      : s === "pass" ? '<div class="answer ' + (signedOff() ? "signed" : "clear") + '">' + (signedOff() ? "Countersigned" : "Not needed") + '</div>' : "";
    var body;
    if (s === "pending") body = '<p class="explain">If anything is risky, the change waits until a named person, the payments lead, approves this exact version. It\'s a bank\'s maker–checker rule, for code.</p>';
    else if (s === "running") body = '<p class="explain">Working out who needs to sign…</p>';
    else if (signedOff()) {
      body = '<div class="signoff"><div class="person">' + av(LEAD, "lg") + '<div><b>' + LEAD.name + '</b><span>' + LEAD.role + '</span></div></div>' +
        '<div><div class="signature' + (S.justSigned ? " write" : "") + '" aria-label="Signature of ' + LEAD.name + '">' + LEAD.name + '</div>' +
        '<div class="sigline">' + longDate(new Date(S.approvedAt)) + ' · commit ' + esc(v.commit) + '</div></div></div>';
      S.justSigned = false;
    }
    else if (s === "fail") body = '<div class="signoff"><div class="person">' + av(LEAD, "lg") + '<div><b>' + LEAD.name + '</b><span>' + LEAD.role + ' · asked to review. Merging is blocked until she signs.</span></div></div></div>';
    else body = '<p class="explain">Nothing risky, so no extra signature is needed. An audit record was saved anyway.</p>';
    checkShell(el, "signoff", 3, answer, body);
  }

  // ---------- the story ----------
  async function runChecks() {
    if (S.busy || S.phase !== "idle") return;
    S.busy = true; S.phase = "running";
    var v = V();
    if (current() !== "change") location.hash = "#/change";
    log(null, "started checking commit " + v.commit);
    paint(); focusOn("verdict");

    S.steps.tests = "running"; paint(); await sleep(900);
    S.steps.tests = "pass"; paint(); await sleep(300);

    await gate("callers");
    S.steps.callers = "running"; S.scanned = -1; paint(); focusOn("chkCallers");
    for (var i = 0; i < v.callers.callers.length; i++) { S.scanned = i; paintCallers(); await sleep(320); }
    S.steps.callers = v.callers.affected ? "warn" : "pass"; paint(); await sleep(500);

    await gate("money");
    S.steps.money = "running"; S.replayed = 0; S.wrongSeen = 0; paint(); focusOn("chkMoney");
    await replayAnimation(v.money, 3200);
    S.steps.money = v.money.wrong.length ? "fail" : "pass"; paint(); await sleep(500);

    await gate("signoff");
    S.steps.signoff = "running"; paint(); focusOn("chkSignoff"); await sleep(800);
    S.justStamped = true;
    if (risky(v)) {
      S.steps.signoff = "fail"; S.phase = "stopped"; S.askedAt = now();
      S.auditSel = 0; S.audits.unshift(makeAudit("stopped"));
      log(null, "stopped #" + D.change.number + ": " + n(v.money.wrong.length) + " refunds wrong, " + v.callers.affected + " apps break");
      log(null, "asked Ananya (payments lead) to review");
    } else {
      S.steps.signoff = "pass"; S.phase = "clear";
      S.auditSel = 0; S.audits.unshift(makeAudit("all clear"));
      log(null, "found nothing wrong with commit " + v.commit + ". All clear.");
    }
    S.busy = false; paint();
    await sleep(1400); focusOn("verdict");
  }

  function replayAnimation(m, duration) {
    var total = m.replayed, wrongIdx = m.wrong.map(function (w) { return w[0]; });
    return new Promise(function (resolve) {
      var start = performance.now(), d = duration / SPEED, lastShown = 0;
      // A timer, not requestAnimationFrame, so it keeps going if the tab is in the background.
      function frame() {
        var p = Math.min(1, (performance.now() - start) / d);
        S.replayed = Math.round(total * (1 - Math.pow(1 - p, 2)));
        var seen = 0; while (seen < wrongIdx.length && wrongIdx[seen] < S.replayed) seen++;
        S.wrongSeen = seen;
        var shownNow = Math.min(5, seen);
        if (shownNow !== lastShown || p === 1) { paintMoney(); lastShown = shownNow; }
        else {
          var r = document.getElementById("cReplayed");
          if (r) {
            r.textContent = n(S.replayed);
            document.getElementById("cOk").textContent = n(S.replayed - seen);
            document.getElementById("cBad").textContent = n(seen);
            document.getElementById("barOk").style.width = ((S.replayed - seen) / total * 100) + "%";
            document.getElementById("barKo").style.width = (seen / total * 100) + "%";
          }
        }
        if (p < 1) setTimeout(frame, 16); else resolve();
      }
      setTimeout(frame, 16);
    });
  }

  async function pushFix() {
    if (S.busy || S.phase !== "stopped") return;
    S.fixedAt = now();
    log(DEV, "pushed a fix: " + D.fix.title);
    S.version = "fix"; S.phase = "idle"; S.approvedBy = null; S.approvedAt = null;
    S.steps = { tests: "pending", callers: "pending", money: "pending", signoff: "pending" };
    paint(); focusOn("tlFix");
    toast("Rohan pushed a new commit. Countersign checks it again.");
    await sleep(2200);
    await runChecks();
  }

  async function approve() {
    if (S.busy || S.phase !== "stopped") return;
    S.busy = true;
    S.steps.signoff = "running"; paint(); focusOn("chkSignoff"); await sleep(1000);
    S.approvedBy = LEAD.name + " (" + ROLE + ")"; S.approvedAt = now().toISOString().replace(/\.\d+/, "");
    S.steps.signoff = "pass"; S.phase = "approved"; S.justSigned = true; S.justStamped = true;
    S.auditSel = 0; S.audits.unshift(makeAudit("approved"));
    log(LEAD, "approved and countersigned #" + D.change.number + " (commit " + V().commit + ")");
    S.busy = false; paint();
    await sleep(2600); focusOn("verdict");
  }

  function resetDemo() {
    if (S.busy) return;
    var audits = S.audits;
    S = freshState(); S.audits = audits; S.auditSel = 0; tabState = { bad: 0, fix: 0 };
    if (current() === "change") renderChange(); else route();
    toast("Starting again. Change #" + D.change.number + " is waiting to be checked.");
  }

  // ---------- Audit log ----------
  var VERDICT = { "stopped": ["Stopped", "stop"], "all clear": ["All clear", "clear"], "approved": ["Countersigned", "signed"], "merged": ["Merged", "merged"] };
  function verdictLabel(a) { return VERDICT[a.verdict] || [a.verdict, ""]; }
  function versionOf(a) { return a.commit === D.fix.commit ? D.fix : D.bad; }

  function renderAudit() {
    var list = S.audits.map(function (a, i) {
      var vl = verdictLabel(a);
      return '<li><button type="button" data-rec="' + i + '" class="' + (i === S.auditSel ? "on" : "") + '">' +
        '<span class="r1"><span>' + (a.verdict === "merged" ? "Merged into main" : a.verdict === "approved" ? "Signed by " + LEAD.first : a.verdict === "stopped" ? "Change stopped" : "Checks passed") + '</span><span class="pill ' + vl[1] + '">' + vl[0] + '</span></span>' +
        '<span class="r2">' + clock(new Date(a.created_at)) + ' · commit ' + esc(a.commit) + '</span></button></li>';
    }).join("");
    view.innerHTML =
      '<div class="page-head"><div><h1>Audit log</h1><p>Every decision Countersign makes is written down: what it checked, what it found, who signed, and when.</p></div></div>' +
      (S.audits.length
        ? '<div class="audit-layout"><section class="sheet"><div class="sheet-h"><h2>Records</h2><span class="aside">' + S.audits.length + '</span></div><ul class="reclist">' + list + '</ul></section>' +
          '<div id="auditDoc" style="min-width:0"></div></div>'
        : '<section class="sheet sheet-b muted">No records yet. Open <a href="#/change">change #' + D.change.number + '</a> and run Countersign. Each decision it makes appears here as a signed record.</section>') +
      '<p class="muted" style="font-size:13.5px;margin-top:14px">On GitHub, each record is also saved as a file on the workflow run and linked from the pull request.</p>';
    view.querySelectorAll("[data-rec]").forEach(function (b) {
      b.onclick = function () { S.auditSel = +b.getAttribute("data-rec"); renderAudit(); if (window.innerWidth < 880) document.getElementById("auditDoc").scrollIntoView({ behavior: "smooth" }); };
    });
    if (S.audits.length) document.getElementById("auditDoc").innerHTML = auditDoc(S.audits[Math.min(S.auditSel, S.audits.length - 1)]);
    updateNav();
  }

  function auditDoc(a) {
    var v = versionOf(a), m = v.money, c = v.callers, vl = verdictLabel(a), at = new Date(a.created_at);
    var broken = c.callers.filter(function (x) { return x.affected; });
    var so = a.sign_off, signed = !!so.approved_by;

      '<p>All ' + v.tests + ' of the team\'s own unit tests passed on commit <span class="ref">' + esc(a.commit) + '</span>.</p>');

    var s2body = '<p>Countersign compared the old and new API, and read the gateway logs for the ' + c.total + ' apps that call <span class="ref">' + esc(a.api) + '</span>.</p>';
    if (broken.length) s2body += '<p>' + broken.length + ' of them will break:</p><ul>' + broken.map(function (x) {
      return '<li><b>' + esc(x.name) + '</b> (' + short(x.calls_per_day) + ' calls a day): ' + esc(x.reason) + '.</li>'; }).join("") + '</ul>';
    else s2body += '<p>None of them break. Every app sends <code>amount</code> in the unit the API expects.</p>';
    if (fc.tool) s2body += '<p class="muted" style="font-size:13px">Format check (oasdiff): ' + (fc.breaking === 0 ? "no breaking changes found" : fc.breaking + " breaking changes") + '.</p>';
    var s2 = docSection(2, "Who will break?", broken.length ? '<span class="res warn">' + broken.length + ' of ' + c.total + ' apps break</span>' : '<span class="res ok">No apps break</span>', s2body);

    var s3body = '<p>Replayed ' + n(m.replayed) + ' refunds from last week (a masked copy, sample data) through the old code and this change, against the rule <code>' + esc(m.rules[0].check) + '</code>: ' + esc(m.rules[0].message) + '.</p>';
    if (m.wrong.length) {
      s3body += '<p>' + n(m.wrong.length) + ' refunds broke the rule. The first three:</p><div class="tablewrap"><table><thead><tr><th>Order</th><th>App</th><th class="num">Paid</th><th class="num">This change sends</th></tr></thead><tbody>' +
        m.wrong.slice(0, 3).map(function (w) { return '<tr><td><code>' + esc(w[1]) + '</code></td><td>' + esc(w[2]) + '</td><td class="num">' + inr(w[3]) + '</td><td class="num over">' + inr(w[5]) + '</td></tr>'; }).join("") +
        '</tbody></table></div>';
    } else s3body += '<p>Every one came out right.</p>';
    var s3 = docSection(3, "Is the money right?", m.wrong.length ? '<span class="res no">' + n(m.wrong.length) + ' wrong</span>' : '<span class="res ok">All correct</span>', s3body);

    var s4body;
    if (!so.needed) s4body = '<p>No signature was needed: nothing risky was found.</p>';
    else if (signed) {
      var sAt = new Date(so.approved_at);

        '<div class="sig"><p class="sig-statement">I have read the results above and approve commit <span class="ref">' + esc(a.commit) + '</span> of change #' + a.pull_request + '. This approval is for this commit only.</p>' +
        '<div class="sig-block"><div class="signature" aria-label="Signature of ' + LEAD.name + '">' + LEAD.name + '</div>' +
        '<div class="sigline"><b>' + LEAD.name + '</b>, ' + LEAD.role.toLowerCase() + '<br>' + longDate(sAt) + '</div></div></div>';
    } else {
      s4body = '<p>This change was risky, so it needs the ' + esc(so.approver_role) + '\'s approval. Countersign asked ' + LEAD.name + ' to review.</p>' +
        '<div class="sig"><p class="sig-statement">Not signed. Merging stays blocked until the payments lead signs, or the developer fixes the change.</p>' +
        '<div class="sig-block"><div class="sig-empty"></div><div class="sigline">Waiting for <b>' + LEAD.name + '</b>, ' + LEAD.role.toLowerCase() + '</div></div></div>';
    }
    var s4 = docSection(4, "Sign-off", !so.needed ? '<span class="res ok">Not needed</span>' : signed ? '<span class="res signed">Signed</span>' : '<span class="res no">Waiting</span>', s4body);

    var out = a.verdict === "stopped" ? "Stopped. The change could not be merged."
      : a.verdict === "approved" ? "Approved by the " + so.approver_role + ". The change could be merged."
      : a.verdict === "merged" ? "Merged into <span class=\"ref\">" + esc(a.merged.into) + "</span> by " + esc(a.merged.by) + " at " + clock(new Date(a.merged.at)) + (signed ? ", with the " + so.approver_role + "'s countersignature." : ", after every check passed.")
      : "All clear. The change could be merged.";
    var s5 = docSection(5, "Outcome", '<span class="res ' + (vl[1] === "stop" ? "no" : vl[1] === "clear" ? "ok" : "signed") + '">' + vl[0] + '</span>', '<p>' + out + '</p>');

    return '<article class="sheet doc">' +
      '<header class="doc-h"><div class="lh"><svg width="34" height="34" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--pen)"/><path d="M6 17.5c2.2-5.6 4.4-8.4 6-8.4 2 0-.6 7.6 1.4 7.6 1.6 0 2.8-4.2 4.4-4.2 1.2 0 .8 3 2 3 .9 0 1.7-.8 2.4-1.8" fill="none" stroke="var(--on-pen)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<div><b>Countersign</b><span>Audit record</span></div></div><div class="stamp' + stampCls + '">' + vl[0] + '</div></header>' +
      '<div class="doc-id">Record <code>' + esc(a.audit_id) + '</code> · ' + longDate(at) + '</div>' +
      '<h2 class="doc-title">Change #' + a.pull_request + ': ' + esc(D.change.title) + '</h2>' +
      '<dl class="facts">' +
        '<dt>API</dt><dd><span class="ref">' + esc(a.api) + '</span></dd>' +
        '<dt>Author</dt><dd>' + av(DEV) + esc(a.author) + ', developer</dd>' +
        '<dt>Commit</dt><dd><span class="ref">' + esc(a.commit) + '</span> ' + esc(v.title) + '</dd>' +
        '<dt>Branch</dt><dd><span class="ref">' + esc(D.change.branch) + '</span> into <span class="ref">' + esc(D.change.base) + '</span></dd>' +
        '<dt>Checked by</dt><dd>Countersign, in the company\'s own CI</dd>' +
      '</dl>' + s1 + s2 + s3 + s4 + s5 +
      '<footer class="doc-foot"><span>Written by Countersign when it made this decision. Sample workspace: the people, payments and companies are made up.</span>' +
        '<details class="raw"><summary>Show the raw record (JSON)</summary><pre class="json">' + esc(JSON.stringify(a, null, 2)) + '</pre></details></footer>' +
    '</article>';
  }
  function docSection(num, title, result, body) {
    return '<section class="doc-s"><h3><span class="n">' + num + '</span>' + esc(title) + result + '</h3>' + body + '</section>';
  }

  // ---------- How it works ----------
  function renderHow() {
    var bad = D.bad, ex = bad.money.wrong[0];
    view.innerHTML =
      '<div class="page-head"><div><h1>How Countersign works</h1></div></div>' +
      '<p class="lede">A code change can pass every test and still send the wrong amount of money. Countersign checks every pull request that touches money. When a change could pay out wrongly, it stops the change, shows the exact payment that would go wrong, and waits for a named person to sign.</p>' +
      '<div class="three">' +
        howCard(1, "Who will break?", "Compares the old and new API, then reads the company's own gateway logs to find every app that sends the field that changed.",
          "The merchant dashboard and the partner shopping app still send paise. The new code reads rupees.",
          "The standard API checker (oasdiff) passes this change. A number is still a number. Only its meaning changed.") +
        howCard(2, "Is the money right?", "Replays last week's real payments (a masked copy) through the old and the new code, then checks money rules like \"a refund can't be more than what was paid\".",

      '</div>' +
      '<section class="sheet analogy" style="margin-top:18px"><p>Banks have done this for a long time. One person makes a payment and a second person checks it before it goes out. It\'s called <b>maker–checker</b>. Countersign brings the same rule to code that moves money.</p>' +
        '<div class="stamp signed" style="font-size:13px">Checked</div></section>' +
      '<section class="sheet" style="margin-top:18px"><div class="sheet-h"><h2>Where it runs</h2></div><div class="flow">' +
        '<div class="box"><b>Developer</b>opens a pull request</div><div class="arr">' + ICON.arrow + '</div>' +
        '<div class="box us"><b>Countersign</b>runs in the company\'s own CI (GitHub Actions)</div><div class="arr">' + ICON.arrow + '</div>' +
        '<div class="box"><b>Reads, inside the company</b>API spec, gateway logs, masked payments</div><div class="arr">' + ICON.arrow + '</div>' +
        '<div class="box"><b>Result on the pull request</b>stopped or all clear, a comment, an audit record</div>' +
      '</div><div class="sheet-b" style="padding-top:0"><p class="explain" style="margin:0">Code and payment data never leave the company. Countersign\'s own rules run from the main branch, so a pull request can\'t switch them off.</p></div></section>' +
      '<section class="sheet sheet-b" style="margin-top:18px"><b>About this demo.</b> <span class="muted">It runs the idea on one sample refund API with made-up, masked data, and it isn\'t a product a company can install yet. Rohan and Ananya are made-up teammates. Every number on this site comes from really running the checks on that sample.</span></section>' +
      '<p style="margin-top:20px"><a class="btn primary" href="#/change">See it on change #' + D.change.number + ICON.arrow + '</a></p>';
    updateNav();
  }
  function howCard(num, title, how, demo, why) {
    return '<section class="sheet how"><div class="eyebrow">Check ' + num + '</div><h3>' + esc(title) + '</h3><p>' + esc(how) + '</p>' +
      '<dl><div><dt>In this demo</dt><dd>' + esc(demo) + '</dd></div><div><dt>Why it matters</dt><dd>' + esc(why) + '</dd></div></dl></section>';
  }

  // ---------- keyboard + autoplay ----------
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if (k === "r") runChecks();
    else if (k === "f") pushFix();
    else if (k === "a") approve();
    else if (k === "0") resetDemo();
    else if (k === "m") merge();
  });

  route();

  // #/change?play=fix (or play=approve) acts out the whole story by itself, for recording.
  var play = params.get("play");
  if (play && current() === "change") {
    (async function () {
      await sleep(1800); await runChecks();
      await sleep(4000);
      if (play === "approve") await approve(); else await pushFix();
      await sleep(3000); await merge();
    })();
  }
})();
</script>
</body>
</html>
